<script type="module">
// 골고 회원 화면: 쿼터 영상, 나 찾기, 내 경기 분석, 선수 카드, 순위, 지난 경기 비교, 부하 관리
// 관리 메뉴: 구글 로그인한 운영진 또는 기존 연결 링크로 연결된 휴대폰에만 보인다
const FBV='13.4.0';
const DEF_CFG={"apiKey":"AIzaSyDvJZfjmVWOMXzNAgYciQC80qDx8n3iP6E","authDomain":"benchzero-50f14.firebaseapp.com","projectId":"benchzero-50f14","storageBucket":"benchzero-50f14.firebasestorage.app","messagingSenderId":"279178405228","appId":"1:279178405228:web:11cefb680a5a1c85837f49"};
// 순위 탭(회원끼리 순위)을 보일지. 끄면 순위 탭, 나이대별 순위 전환, "함께 뛴 회원 중 ○번째" 문장, 그날 1위 배지를 함께 숨긴다
const SHOW_RANK=false;
const TEST_PREFIX='matchcamtest';   // 시험용 코드는 이 휴대폰에 저장하지 않는다(실제 출석 등록을 건드리지 않게)
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hm=t=>{const d=new Date(t);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const store=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const DEV=(()=>{try{let d=localStorage.getItem('bz-dev');if(!d){d='m'+Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>b.toString(36)).join('').slice(0,14);localStorage.setItem('bz-dev',d)}return d}catch(e){return 'm'+Math.random().toString(36).slice(2)}})();
const DN=['일','월','화','수','목','금','토'];
const dLabel=ds=>{const d=new Date(ds+'T00:00');return `${d.getMonth()+1}/${d.getDate()}(${DN[d.getDay()]})`};
const km=m=>m==null?'-':(m>=1000?(m/1000).toFixed(2)+'km':Math.round(m)+'m');
const pct=v=>v==null?'-':Math.round(v>1?v:v*100)+'%';

// 상태
const ST={conf:null,test:false,me:null,P:null,F:null,db:null,auth:null,A:null,user:null,admin:false,linkAdmin:false,
  // 출석 화면의 탭(member.html?tab=mine)에서 오면 그 탭으로 연다
  ana:[],claims:{},norm:null,rankAge:false,sel:null,tab:(/[?&]tab=(game|mine|admin)\b/.exec(location.search)||[0,'game'])[1],rank:'q',cam:null,marks:[],msg:'',mcls:'',q:'',confirm:null,err:'',mine:{},crops:{},cropLd:{},idx:null,loadedDates:new Set(),frameLd:{},allLoaded:false,sdkP:null,sugNo:{},reFind:{},pick:{},fteam:{},att:{},attSet:{},more:{},prof:{}};

// 축구회 코드 읽기: 출석(checkin.html)과 같은 저장 키(bz-ci, bz-me)를 쓴다
function readConf(){
  const h=location.hash;let code=null,cfg=DEF_CFG;
  const s=h.match(/^#((?:ci-)?[a-z0-9-]{16,})$/i);if(s)code=s[1];
  const m=h.match(/#c=([^&]+)/);
  if(m){try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));if(o.cfg&&o.code){code=o.code;cfg=o.cfg}}catch(e){}}
  if(code){
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    if(code.startsWith(TEST_PREFIX)){ST.test=true;try{sessionStorage.setItem('bz-mtest',code)}catch(e){}return{cfg,code}}
    const o={cfg,code};store('bz-ci',o);const old=load('bz-ci-code');if(old&&old!==code)store('bz-me',null);store('bz-ci-code',code);return o;
  }
  try{const t=sessionStorage.getItem('bz-mtest');if(t){ST.test=true;return{cfg:DEF_CFG,code:t}}}catch(e){}
  const c=load('bz-ci');if(c&&c.code)return c;
  // 운영진 휴대폰: 관리 화면에 저장된 회원 체크인 코드를 쓴다
  const S=load('jogi-rotation-v2');if(S&&S.ci&&S.ci.code)return{cfg:DEF_CFG,code:S.ci.code};
  return null;

// 분석 문서 도우미
const docId=a=>a.id;
const sortedAna=()=>ST.ana.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.q||0)-(b.q||0));
// 경기 날짜 목록(최근 순): 경기 목록(ST.idx)이 있으면 그것으로, 아직이면 받은 문서로
const dates=()=>ST.idx?[...new Set(ST.idx.map(x=>x.date))].sort().reverse():[...new Set(sortedAna().map(a=>a.date))].reverse();
function tidsOf(a,pid){return (a.tracks||[]).map(t=>String(t.tid)).filter(tid=>ownerOf(a,tid)===pid)}
// ---------- 분석 계산 ----------
const nz=v=>v!=null&&typeof v==='number'&&!isNaN(v);
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
function sumObj(L,k){const o={};let any=false;L.forEach(s=>{const v=s[k];if(!v)return;any=true;for(const z in v)o[z]=(o[z]||0)+(v[z]||0)});return any?o:null}
function wObj(L,k){const LL=L.filter(s=>s[k]);if(!LL.length)return null;const o={};let W=0;LL.forEach(s=>{const w=s.mins||1;W+=w;for(const z in s[k])o[z]=(o[z]||0)+(s[k][z]||0)*w});for(const z in o)o[z]/=W;return o}
function wAvg(L,k){const LL=L.filter(s=>nz(s[k]));if(!LL.length)return null;let W=0,t=0;LL.forEach(s=>{const w=s.mins||1;W+=w;t+=s[k]*w});return t/W}
// 분석기가 안 준 값 중 계산할 수 있는 것만 채운다
// 카메라 방식은 순간 오차로 최고 속도가 튈 수 있어 34km/h 를 넘는 값은 오류로 보고 버린다
const VMAX_OK=34,okV=v=>nz(v)&&v>0&&v<=VMAX_OK;
function fillStat(s){s=Object.assign({},s);if(!okV(s.vmaxKmh))s.vmaxKmh=null;if(!nz(s.workRate)&&s.mins)s.workRate=s.distM/s.mins;if(!nz(s.avgKmh)&&s.mins)s.avgKmh=s.distM/s.mins*0.06;return s}
// 여러 기록(같은 쿼터의 여러 추적 번호, 또는 하루의 여러 쿼터)을 하나로 합친다
function mergeStats(L){
  L=L.filter(Boolean);if(!L.length)return null;
  if(L.length===1){const s=fillStat(L[0]);s._segs=s.speedSeries?[s.speedSeries.length]:[];s._d5=s.dist5&&s.dist5.length?[s.dist5]:[];s._d5m=s._d5.length?[s.mins]:[];return s}
  const r={},has=k=>L.some(s=>nz(s[k]));
  ['mins','distM','sprints','hsrM','sprintM','accels','decels','turns','rsa','boxEntries'].forEach(k=>{if(has(k))r[k]=L.reduce((t,s)=>t+(s[k]||0),0)});
  const z=sumObj(L,'zones');if(z)r.zones=z;const zs=sumObj(L,'zoneSec');if(zs)r.zoneSec=zs;
  {const v=L.map(s=>s.vmaxKmh).filter(okV);r.vmaxKmh=v.length?Math.max(...v):null}
  ['coverPct','devM','nearMate','ownHalf','lineDevM'].forEach(k=>{const v=wAvg(L,k);if(v!=null)r[k]=v});
  ['thirds','lanes','dirs','v2'].forEach(k=>{const v=wObj(L,k);if(v)r[k]=v});
  if(has('hiRatio')){const d=L.reduce((t,s)=>t+(s.distM||0),0);r.hiRatio=d?L.reduce((t,s)=>t+(s.hiRatio||0)*(s.distM||0),0)/d:0}
  const ss=L.filter(s=>s.speedSeries&&s.speedSeries.length);r.speedSeries=ss.length?[].concat(...ss.map(s=>s.speedSeries)):null;r._segs=ss.map(s=>s.speedSeries.length);
  {const H=L.filter(s=>Array.isArray(s.hsrHalves));if(H.length)r.hsrHalves=[H.reduce((t,s)=>t+(s.hsrHalves[0]||0),0),H.reduce((t,s)=>t+(s.hsrHalves[1]||0),0)]}
  r._d5=L.filter(s=>s.dist5&&s.dist5.length).map(s=>s.dist5);r._d5m=L.filter(s=>s.dist5&&s.dist5.length).map(s=>s.mins);
  r.sprintPaths=[].concat(...L.map(s=>s.sprintPaths||[]));
  const hs=L.filter(s=>s.heat&&s.heat.length===96);if(hs.length){const h=new Array(96).fill(0);hs.forEach(s=>s.heat.forEach((v,i)=>h[i]+=v*(s.mins||1)));const mx=Math.max(...h,1e-9);r.heat=h.map(v=>v/mx)}
  const b=L.reduce((p,s)=>(s.mins||0)>(p.mins||0)?s:p,L[0]);r.avg=b.avg;r.board=b.board;
  return fillStat(r);
}
// 분석기 좌표(운동장 절대 좌표: x=0 A팀 골라인, y=0 카메라 쪽 터치라인, heat 0번 행=카메라 쪽 줄)를
// 화면 좌표(공격이 오른쪽, 그림 위 = 공격 방향 기준 왼쪽)로 바꾼다. A팀: y 만 뒤집음. B팀: 180도 돌린 뒤 위아래 뒤집기 = x 만 뒤집음
const teamOf=(a,tid)=>{const t=(a.tracks||[]).find(x=>String(x.tid)===String(tid));return t&&t.team||'A'};
function viewPt(p,team,P){if(!Array.isArray(p)||p.length<2)return p;const b=team==='B';return [b?P.w-p[0]:p[0],b?p[1]:P.h-p[1]]}
function viewStat(s,team,P){
  if(!s)return s;const b=team==='B',o=Object.assign({},s);
  if(s.avg)o.avg=viewPt(s.avg,team,P);if(s.board)o.board=viewPt(s.board,team,P);
  if(Array.isArray(s.sprintPaths))o.sprintPaths=s.sprintPaths.map(p=>toPath(p).map(q=>viewPt(q,team,P)));
  if(Array.isArray(s.heat)&&s.heat.length===96){const h=new Array(96);for(let r=0;r<8;r++)for(let c=0;c<12;c++)h[r*12+c]=s.heat[(b?r:7-r)*12+(b?11-c:c)];o.heat=h}
  return o;
}
function statOf(a,pid){const P=pitchOf(a);return mergeStats(tidsOf(a,pid).map(t=>viewStat(a.stats&&a.stats[t],teamOf(a,t),P)))}
// 사람별 기록 모음: 전체 분석 문서에서 pid 로 묶는다
function allRows(){const out=[];sortedAna().forEach(a=>{const seen=new Set();(a.tracks||[]).forEach(t=>{const pid=ownerOf(a,t.tid);if(!pid||seen.has(pid))return;seen.add(pid);const s=statOf(a,pid);if(s)out.push({a,pid,s})})});return out}

//   쿼터 유튜브 영상의 그 시각(video.offsetSec + 칸×10초, 2초 앞부터)으로 건너뛴다. 내 번호가 여러 개면 칸마다 빠른 쪽
//   (공 추적이 되면 공 잡은·패스한 장면을 더한다)
const SCENE_MIN_KMH=14,SCENE_MAX=6,SCENE_GAP_S=30;
function myScenes(a){
  const me=ST.me&&ST.me.pid;if(!me)return [];
  const S=tidsOf(a,me).map(t=>a.stats&&a.stats[t]&&a.stats[t].speedSeries).filter(Array.isArray);if(!S.length)return [];
  const n=Math.max(...S.map(x=>x.length)),bins=[];
  for(let i=0;i<n;i++){let v=null;S.forEach(x=>{const y=x[i];if(typeof y==='number'&&(v==null||y>v))v=y});if(v!=null&&v>=SCENE_MIN_KMH)bins.push({i,v})}
  const pick=[];bins.sort((x,y)=>y.v-x.v).forEach(b=>{if(pick.length<SCENE_MAX&&pick.every(p=>Math.abs(p.i-b.i)*10>=SCENE_GAP_S))pick.push(b)});
  return pick.sort((x,y)=>x.i-y.i).map(b=>({sec:b.i*10,kmh:b.v,label:b.v>=20?'전력 질주':'빠르게 달림'}));
}
function myScenesHtml(a){
  const L=myScenes(a);if(!L.length)return '';
  const id=ytId(a.video&&a.video.yt),off=Math.round((a.video&&a.video.offsetSec)||0);
  const mmss=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  return `<h3 style="margin:.7rem 0 .3rem">내 장면 <span class="hint">빠르게 뛴 순간 ${L.length}개</span></h3>
    <div style="display:flex;flex-wrap:wrap;gap:.3rem">${L.map(x=>`<button data-seek="${Math.max(0,off+x.sec-2)}" ${id?'':'disabled'} style="flex:1 1 9rem;line-height:1.25;padding:.35rem .5rem">▶ ${mmss(x.sec)} ${x.label}<br><small class="hint">${Math.round(x.kmh)}km/h</small></button>`).join('')}</div>
    ${id?'':'<p class="hint" style="margin:.3rem 0 0">유튜브 영상이 붙으면 눌러서 그 장면으로 바로 갈 수 있어요.</p>'}`;
}
function ytId(u){if(!u)return null;const m=String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(u)?u:null)}
function videoHtml(a){
  const v=a.video||{},id=ytId(v.yt);
  // 내 장면 버튼을 눌렀으면(ST.seek) 그 시각부터 바로 재생
  const sk=ST.seek&&ST.seek[a.id];
  if(id){const st=sk!=null?sk:Math.max(0,Math.round(v.offsetSec||0));const q=[st?'start='+st:'',sk!=null?'autoplay=1':''].filter(Boolean).join('&');return `<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${id}${q?'?'+q:''}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${a.q}쿼터 영상"></iframe></div>`}
  if(v.drive)return `<div class="ready"><p style="margin:0 0 .5rem">유튜브 영상은 아직 준비 중이에요. 드라이브에서 임시로 볼 수 있어요.</p><a href="${esc(v.drive)}" target="_blank" rel="noopener"><button class="pri">드라이브에서 보기</button></a></div>`;
  return `<div class="ready">영상 준비 중이에요. 쿼터 영상이 올라오면 여기서 바로 볼 수 있어요.</div>`;

// ---------- 나 찾기 ----------
// 주인 정하는 순서: 작전판·운영진이 tracks 에 붙인 pid > 회원이 고른 mine/{pid} > 옛 방식 claim/{tid}
const MINE_HOURS=18;   // 처음 고른 뒤 이 시간 안에는 본인이 바꿀 수 있다(Firestore 규칙과 같은 값)
function mineInv(a){const m=ST.mine[a.id];if(!m)return {};if(m._inv)return m._inv;const r={};for(const pid in m){if(pid[0]!=='_'&&m[pid]&&m[pid].tid!=null)r[String(m[pid].tid)]=pid}Object.defineProperty(m,'_inv',{value:r,enumerable:false});return r}
const tsMs=v=>v&&v.toMillis?v.toMillis():typeof v==='number'?v:null;
function teamColor(a,tm){return (a.team&&a.team[tm]&&a.team[tm].color)||{A:'#2563eb',B:'#dc2626'}[tm]||'#64748b'}
function posWords(p,P){const x=p[0]/P.w,y=p[1]/P.h;return (x<.38?'수비':x<.66?'중앙':'공격')+' '+(y<.34?'왼쪽':y<.67?'가운데':'오른쪽')}
// 선수 사진: 분석기가 올린 crop 사진, 없으면 첫 장면에서 그 사람 둘레를 잘라 보여 준다
function cropHtml(a,tid,cls){
  const c=ST.crops[a.id]&&ST.crops[a.id][tid],j=c&&c.jpgs&&c.jpgs[0];
  if(j)return `<img class="crop ${cls||''}" src="${j.startsWith('data:')?j:'data:image/jpeg;base64,'+j}" alt="선수 사진">`;
  const t=(a.tracks||[]).find(x=>String(x.tid)===String(tid)),f=a.frame;
  if(!t||!t.box||!f||!f.jpg)return `<div class="crop ${cls||''}"></div>`;
  const[x,y,w,h]=t.box,fw=f.w||16,fh=f.h||9,rh=Math.min(1,h*1.6),rw=Math.min(1,0.6*rh*fh/fw),l=Math.max(0,Math.min(1-rw,x+w/2-rw/2)),tp=Math.max(0,Math.min(1-rh,y+h/2-rh/2));
  const src=f.jpg.startsWith('data:')?f.jpg:'data:image/jpeg;base64,'+f.jpg;
  return `<div class="crop ${cls||''}" style="background-image:url(${src});background-size:${100/rw}% ${100/rh}%;background-position:${rw<1?l/(1-rw)*100:0}% ${rh<1?tp/(1-rh)*100:0}%"></div>`;
}
function bigCrops(a,tid){const c=ST.crops[a.id]&&ST.crops[a.id][tid],J=(c&&c.jpgs||[]).slice(0,3);
  return J.length?`<div class="bigc">${J.map(j=>`<img src="${j.startsWith('data:')?j:'data:image/jpeg;base64,'+j}" alt="선수 사진">`).join('')}</div>`:`<div class="bigc">${cropHtml(a,tid,'lg')}</div>`}
function ownerOf(a,tid){
  tid=String(tid);const t=(a.tracks||[]).find(x=>String(x.tid)===tid);if(t&&t.pid)return t.pid;
  const mp=mineInv(a)[tid];if(mp)return mp;
  const c=ST.claims[a.id]&&ST.claims[a.id][tid];if(c&&!(ST.mine[a.id]&&ST.mine[a.id][c.pid]))return c.pid;   // 새로 고른 사람이면 옛 claim 은 무시
  // 자동 연결: 분석기가 같은 날 옷 색으로 확신한 경우(suggest.auto). 그 회원이 이 쿼터에서 직접 고른 게 없을 때만
  if(t&&t.suggest&&t.suggest.auto&&t.suggest.pid){const p=t.suggest.pid;if(!(ST.mine[a.id]&&ST.mine[a.id][p])&&!Object.values(ST.claims[a.id]||{}).some(x=>x.pid===p)&&!(a.tracks||[]).some(x=>x.pid===p))return p}
  return null;
}
// 이 쿼터에서 나를 어떻게 찾았는지: 'board' 작전판, 'admin' 운영진, 'mine' 내가 고름, 'claim' 옛 방식, 'auto' 자동 연결
function howFound(a,tid){const me=ST.me.pid,t=(a.tracks||[]).find(x=>String(x.tid)===String(tid));if(t&&t.pid===me)return t.by==='admin'?'admin':'board';
  if(mineInv(a)[String(tid)]===me)return 'mine';const c=ST.claims[a.id]&&ST.claims[a.id][tid];if(c&&c.pid===me)return 'claim';return 'auto'}
// 그날 후보가 될 사람: 출석 체크한 사람(없으면 전체 명단), 쿼터 출전 명단(ana.lineup)이 있으면 그 안에서
function poolOf(a){const att=ST.attSet[a.date],L=Array.isArray(a.lineup)&&a.lineup.length?new Set(a.lineup):null;
  let P=(ST.P&&ST.P.names||[]).map(n=>n.id);if(att&&att.size)P=P.filter(p=>att.has(p));if(L)P=P.filter(p=>L.has(p));return new Set(P)}
// 나에게 추천할 선수: 분석기의 suggest(옷 색, auto 아님) 또는 cands(습관) 중 내 점수가 가장 높은 것
function recommendFor(a){
  const me=ST.me.pid,pool=poolOf(a);if(pool.size&&!pool.has(me))return null;let best=null;
  (a.tracks||[]).forEach(t=>{if(ownerOf(a,t.tid))return;let sc=null,why='';
    if(t.suggest&&t.suggest.pid===me&&!t.suggest.auto){sc=(t.suggest.score||0)+1;why='앞 쿼터에서 찾은 모습과 옷이 비슷해요.'}
    else if(Array.isArray(t.cands)){const c=t.cands.find(x=>x.pid===me);if(c){sc=c.score||0;why='평소 내가 뛰는 자리·움직임과 비슷해요.'}}
    if(sc!=null&&(!best||sc>best.sc))best={t,sc,why}});
  return best;

function findHtml(a){

  if(ST.crops[a.id]&&!(a.frame&&a.frame.jpg)&&tr.some(t=>!ST.crops[a.id][t.tid]))loadFrame(a.id);
  if(!tr.length)return `<p class="hint">이 쿼터는 아직 선수 분석이 안 됐어요.</p>`;

    return `<div class="found">${cropHtml(a,tid,'lg')}<div><p style="margin:0"><b>${esc(ST.me.name)} 님을 찾았어요</b></p><p class="hint">${txt}</p>
      ${can?`<button data-act="refind">${how==='auto'?'내가 아니에요 · 바꾸기':'다른 사람이었어요'}</button>`:`<p class="hint">틀렸으면 운영진에게 말해 주세요.</p>`}</div></div>`;
  }

  const rc=!ST.sugNo[a.id]&&!ST.reFind[a.id]?recommendFor(a):null;
  if(rc)return `<div class="found">${cropHtml(a,rc.t.tid,'lg')}<div><p style="margin:0"><b>혹시 이분인가요?</b></p><p class="hint">${rc.why}</p>
      <div class="row" style="margin-top:.4rem"><button class="pri" data-act="sugYes" data-t="${esc(rc.t.tid)}">맞아요</button><button data-act="sugNo">아니에요</button></div></div></div>`;
  // 3) 사진에서 고르기
  if(ST.pick[a.id]){const tid=ST.pick[a.id],t=tr.find(x=>String(x.tid)===tid);
    return `${bigCrops(a,tid)}<p style="text-align:center;margin:.4rem 0"><span class="dot" style="background:${teamColor(a,t&&t.team)}"></span>${t&&t.team?t.team+'팀':''}</p>
      <div class="row"><button class="pri" data-act="mineYes" data-t="${esc(tid)}">이 사람이 나예요</button><button data-act="pickNo">다른 사람 보기</button></div>`}

  const zOf=t=>{const i=idfOf(a,t);return i&&i.zone};
  if(bp){const d=t=>{const s=a.stats&&a.stats[t.tid],p=s&&s.avg;return p?Math.hypot(p[0]-bp[0],p[1]-bp[1]):1e9};C=C.slice().sort((x,y)=>d(x)-d(y))}

  const att=poolOf(a).size,lim=att&&att<((ST.P&&ST.P.names||[]).length)?Math.ceil(att/(ft&&teams.length?teams.length:1))+1:99,show=ST.more[a.id]?C:C.slice(0,lim);

    ${teams.length>1?`<p style="margin:0 0 .3rem;font-weight:700;font-size:.9rem">먼저 내 조끼 색을 고르세요</p><div class="seg">${teams.map(tm=>`<button data-fteam="${tm}" class="${ft===tm?'on':''}"><span class="dot" style="background:${teamColor(a,tm)}"></span>${tm}팀</button>`).join('')}<button data-fteam="" class="${!ft?'on':''}">전체</button></div>`:''}

// 습관 식별 정보: 분석기가 준 tracks[].idf, 없으면 stats 로 대신 만든다(키는 없음)
function idfOf(a,t){
  // zone 은 분석기와 같게: x 0 우리 골라인 → 1 상대 골라인, y 0 공격 방향 기준 오른쪽 → 1 왼쪽
  if(t.idf)return t.idf;const P=pitchOf(a),s=viewStat(a.stats&&a.stats[t.tid],t.team,P);if(!s)return null;
  return {zone:s.avg?[+(s.avg[0]/P.w).toFixed(3),+(1-s.avg[1]/P.h).toFixed(3)]:null,lanes:s.lanes||null,thirds:s.thirds||null};
}
// 습관 프로필 갱신: 경기 날 하루에 한 번(그날 첫 확정)만, 새 값 = 이전 + (이번 - 이전) / min(n+1, 8)
async function updateProf(a,tid){
  await ST.sdkP;   // 쓰기는 Firebase 라이브러리가 준비된 뒤
  const t=(a.tracks||[]).find(x=>String(x.tid)===String(tid));if(!t)return;const v=idfOf(a,t);if(!v)return;
  const F=ST.F,me=ST.me.pid,ref=F.doc(ST.db,'pub',ST.conf.code,'prof',me);
  try{const ex=await F.getDoc(ref),o=ex.exists()?ex.data():{n:0,days:[]};const days=o.days||[];if(days.includes(a.date))return;
    const n=o.n||0,w=1/Math.min(n+1,8),mix=(p,q)=>p==null?q:q==null?p:+(p+(q-p)*w).toFixed(3);
    const mixO=(p,q)=>{if(!q)return p||null;if(!p)return q;const r={};for(const k in q)r[k]=mix(p[k],q[k]);return r};
    const out={hM:mix(o.hM??null,v.hM??null),zone:v.zone&&o.zone?[mix(o.zone[0],v.zone[0]),mix(o.zone[1],v.zone[1])]:(v.zone||o.zone||null),
      lanes:mixO(o.lanes,v.lanes),thirds:mixO(o.thirds,v.thirds),n:n+1,days:[...days,a.date].slice(-8),upd:Date.now()};
    await F.setDoc(ref,out);ST.prof[me]=out;
  }catch(e){}
}
// 전체 장면(보기 전용): 내 네모는 노란색
function frameHtml(a){
  const f=a.frame;if(!f)return '<p class="hint">첫 장면이 없어요.</p>';if(!f.jpg)return '<p class="ld">첫 장면 불러오는 중…</p>';
  const mine=new Set(tidsOf(a,ST.me.pid)),src=f.jpg.startsWith('data:')?f.jpg:'data:image/jpeg;base64,'+f.jpg;
  return `<div class="frame" style="aspect-ratio:${f.w||16}/${f.h||9}"><img src="${src}" alt="${a.q}쿼터 첫 장면">${(a.tracks||[]).map(t=>{const[x,y,w,h]=t.box||[0,0,0,0];return `<i class="bx ${t.team||''} ${mine.has(String(t.tid))?'me':''}" style="left:${x*100}%;top:${y*100}%;width:${w*100}%;height:${h*100}%"></i>`}).join('')}</div>`;
}
// 내가 고른 선수 저장: mine/{내 pid} = {tid, ts, firstTs}. 처음 고른 시각(firstTs)에서 MINE_HOURS 안에는 바꿀 수 있다
async function saveMine(a,tid){
  await ST.sdkP;   // 쓰기는 Firebase 라이브러리가 준비된 뒤
  const me=ST.me.pid,o=ownerOf(a,tid);if(o&&o!==me){say(`${nameOf(o)} 님으로 정해진 선수예요.`,'bad');return}
  const F=ST.F,ref=F.doc(ST.db,'pub',ST.conf.code,'ana',a.id,'mine',me);
  try{const ex=await F.getDoc(ref);const now=F.serverTimestamp();
    await F.setDoc(ref,ex.exists()?{tid:String(tid),ts:now,firstTs:ex.data().firstTs}:{tid:String(tid),ts:now,firstTs:now});
    ST.pick[a.id]=null;ST.reFind[a.id]=false;await loadClaims(a.id);updateProf(a,tid);say('나를 찾았어요! 이제 내 기록이 보여요.','ok')}
  catch(e){say('저장하지 못했어요. 처음 고른 지 오래됐으면 운영진에게 바꿔 달라고 해 주세요.','bad')}
}
async function loadCrops(id){
  if(ST.cropLd[id])return;ST.cropLd[id]=1;
  try{const L=await restQuery(`${P_CODE()}/ana/${encodeURIComponent(id)}`,{from:[{collectionId:'crop'}]});const m={};L.forEach(d=>{m[d.id]=d});ST.crops[id]=m;render()}catch(e){ST.crops[id]={}}
}
// 그날 출석한 사람 수(출석 체크 기록). 시험 코드에는 없어서 0 → 제한 없음
async function loadAtt(date){
  if(ST.att[date]!=null)return;ST.att[date]=0;
  try{const L=await restQuery(P_CODE(),{from:[{collectionId:'in'}],select:{fields:fld(['pid'])},where:eqDate(date)});const S=new Set(L.map(d=>d.pid));ST.att[date]=S.size;ST.attSet[date]=S;render()}catch(e){}

  if(streak>=3)B.push(['📅',`${streak}경기 연속 출전`,'']);
  const qn=sortedAna().filter(a=>a.date===last.date).length;if(qn>=3&&last.q>=qn)B.push(['🛡️','전 쿼터 출전',qn+'쿼터']);
  const e=endur(s);if(nz(e)&&e>=0.97)B.push(['🔋','끝까지 지치지 않음','후반 거리 유지']);
  return `<div class="card"><h2>배지 · ${dLabel(last.date)}</h2>${B.length?`<div class="badges">${B.map(([i,t,v])=>`<div><span class="bi">${i}</span><b>${esc(t)}</b>${v?`<small>${esc(v)}</small>`:''}</div>`).join('')}</div>`:'<p class="hint">이번 경기에서 받은 배지가 없어요. 다음 경기에서 도전해 보세요!</p>'}</div>`;
}
function trendSvg(D,f,fmt,label,unit){
  const V=D.map(d=>f(d.s));if(V.filter(nz).length<1)return '';
  const W=320,H=96,pl=6,pr=6,pt=18,pb=16,n=D.length,vs=V.filter(nz),mx=Math.max(...vs),mn=Math.min(...vs),rg=mx-mn||1;
  const X=i=>n>1?pl+i/(n-1)*(W-pl-pr):W/2,Y=v=>pt+(1-(v-mn)/rg)*(H-pt-pb);
  const pts=V.map((v,i)=>nz(v)?`${X(i).toFixed(1)},${Y(v).toFixed(1)}`:null).filter(Boolean).join(' ');
  const pb_i=V.indexOf(mx),last=V[n-1],isPB=n>1&&pb_i===n-1;
  let g=`<polyline points="${pts}" fill="none" stroke="#16a34a" stroke-width="2"/>`;
  V.forEach((v,i)=>{if(nz(v))g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===pb_i?4.5:2.8}" fill="${i===pb_i?'#facc15':'#16a34a'}" stroke="${i===pb_i?'#a16207':'none'}"/>`});
  g+=`<text x="${Math.min(W-30,Math.max(30,X(pb_i)))}" y="${Y(mx)-7}" font-size="10" text-anchor="middle" fill="#a16207" font-weight="700">최고 ${fmt(mx)}</text>`;
  D.forEach((d,i)=>{if(n<=8||i%Math.ceil(n/8)===0||i===n-1)g+=`<text x="${X(i)}" y="${H-3}" font-size="8.5" text-anchor="${n>1&&i===0?'start':n>1&&i===n-1?'end':'middle'}" fill="var(--mute)">${md(d.date)}</text>`});
  return `<div class="trend"><p><b>${label}</b> <span class="hint">최근 ${nz(last)?fmt(last):'-'}${unit}</span>${isPB?' <span class="pill on">개인 최고 갱신</span>':''}</p><svg viewBox="0 0 ${W} ${H}" style="width:100%">${g}</svg></div>`;
}
function trendHtml(D){
  if(D.length<2)return `<div class="card"><h2>시즌 추이</h2><p class="hint">두 경기 이상 기록이 쌓이면 추이를 보여 드려요.</p></div>`;
  return `<div class="card"><h2>시즌 추이</h2>${trendSvg(D,s=>s.distM,v=>(v/1000).toFixed(1),'뛴 거리','km')}${trendSvg(D,s=>s.vmaxKmh,v=>v.toFixed(1),'최고 속도'+REF,'km/h')}${trendSvg(D,s=>s.sprints,v=>Math.round(v),'스프린트','회')}${trendSvg(D,s=>s.workRate,v=>Math.round(v),'분당 거리','m')}<p class="hint">노란 점이 개인 최고 기록(PB)이에요.</p></div>`;
}
// 경기 탭: 이번 경기와 지난 경기 비교 + 최근 경기 표
function gameCmpHtml(D,date){
  const i=D.findIndex(d=>d.date===date);if(i<0)return '';
  const c=D[i],p=D[i-1],arrow=(v,q)=>!nz(v)||!nz(q)?'':v>q*1.03?' <span class="up">▲</span>':v<q*0.97?' <span class="dn">▼</span>':'';
  const M=[['뛴 거리',s=>s.distM,km],['분당 거리',s=>s.workRate,v=>Math.round(v)+'m'],['최고 속도'+REF,s=>s.vmaxKmh,v=>v.toFixed(1)],['고속 거리(쿼터당)',s=>perQ(s,s.hsrM),v=>Math.round(v)+'m'],
    ['스프린트(쿼터당)',s=>perQ(s,s.sprints),v=>v.toFixed(1)],['스태미나',s=>endur(s),v=>Math.round(v*100)+'%']];
  const top=p?`<table><tr><th>항목</th><th>이번 ${md(c.date)}</th><th>지난 ${md(p.date)}</th></tr><tr><td>출전</td><td>${c.q}쿼터</td><td>${p.q}쿼터</td></tr>${M.map(([l,f,fmt])=>{const v=f(c.s),q=f(p.s);if(!nz(v)&&!nz(q))return '';return `<tr><td>${l}</td><td><b>${nz(v)?fmt(v):'-'}</b>${arrow(v,q)}</td><td>${nz(q)?fmt(q):'-'}</td></tr>`}).join('')}</table>`:'<p class="hint">지난 경기 기록이 없어 비교할 수 없어요.</p>';
  const last=D.slice(Math.max(0,i-5),i+1).reverse();
  const tbl=`<h3>최근 경기</h3><table><tr><th>날짜</th><th>Q</th><th>거리</th><th>분당</th><th>최고km/h</th><th>스프린트</th></tr>${last.map((d,j)=>{const q=last[j+1],s=d.s,ps=q&&q.s;
    return `<tr class="${d.date===date?'me':''}"><td>${dLabel(d.date)}</td><td>${d.q}</td><td>${km(s.distM)}</td><td>${nz(s.workRate)?Math.round(s.workRate):'-'}${arrow(s.workRate,ps&&ps.workRate)}</td><td>${nz(s.vmaxKmh)?s.vmaxKmh.toFixed(1):'-'}${arrow(s.vmaxKmh,ps&&ps.vmaxKmh)}</td><td>${nz(s.sprints)?s.sprints:'-'}${arrow(perQ(s,s.sprints),ps&&perQ(ps,ps.sprints))}</td></tr>`}).join('')}</table>`;
  return `<h3>지난 경기와 비교</h3><p class="hint sd">이번 경기와 바로 앞 경기를 나란히 놓았어요. ▲▼는 더 좋아졌는지 나빠졌는지예요(쿼터 수가 달라 분당·쿼터당 값으로 비교).</p>${top}${tbl}`;
}
function loadHtml(D){
  // 최근 1주(급성) ÷ 최근 4주 주평균(만성). 1.3을 넘으면 주의, 1.5를 넘으면 부상 위험이 커진다
  const now=nowMs(),wk=[0,0,0,0],hs=[0,0,0,0];
  D.forEach(d=>{const i=Math.floor((now-Date.parse(d.date+'T12:00'))/(7*864e5));if(i>=0&&i<4){wk[i]+=d.s.distM||0;hs[i]+=d.s.hsrM||0}});
  const chronic=(wk[0]+wk[1]+wk[2]+wk[3])/4,ratio=chronic?wk[0]/chronic:null,mx=Math.max(...wk,1),hasH=hs.some(x=>x>0);
  let msg='최근 4주 기록이 쌓이면 부하를 알려 드려요.',cls='';
  if(nz(ratio)&&wk.filter(x=>x>0).length>=2){
    if(ratio>1.5){msg=`최근 1주 부하가 4주 평균의 ${ratio.toFixed(2)}배로 급격히 늘었어요. 부상 위험이 커요. 다음 경기는 출전 시간을 줄이세요.`;cls='bad'}
    else if(ratio>1.3){msg=`최근 1주 부하가 4주 평균의 ${ratio.toFixed(2)}배예요. 갑자기 늘면 다치기 쉬워요. 조금 줄여 보세요.`;cls='warn'}
    else if(ratio<0.8){msg=`최근 1주는 평소보다 적게 뛰었어요(4주 평균의 ${ratio.toFixed(2)}배). 다시 늘릴 때는 천천히 늘려요.`;cls='warn'}
    else{msg=`적정해요. 최근 1주 부하는 4주 평균의 ${ratio.toFixed(2)}배예요.`;cls='ok'}}
  const L=['최근 1주','1주 전','2주 전','3주 전'],gx=nz(ratio)?Math.min(100,ratio/2*100):null;
  return `<div class="card"><h2>부하 관리</h2><p class="hint sd">최근 1주에 뛴 양을 4주 평균과 비교해요. 갑자기 많이 늘면 다치기 쉬워요.</p>
    ${nz(gx)?`<div class="gauge"><i style="left:0;width:40%;background:#94a3b8"></i><i style="left:40%;width:25%;background:#16a34a"></i><i style="left:65%;width:10%;background:#f59e0b"></i><i style="left:75%;width:25%;background:#dc2626"></i><b style="left:${gx}%"></b></div><div class="gl"><span style="left:0">0</span><span style="left:40%">0.8</span><span style="left:52%">적정</span><span style="left:65%">1.3</span><span style="left:75%">1.5</span><span style="left:100%">2+</span></div>`:''}
    <p class="msg ${cls}">${esc(msg)}</p>
    ${[3,2,1,0].map(i=>`<div class="row" style="margin:.25rem 0"><span style="flex:0 0 4.2rem;font-size:.85rem">${L[i]}</span><div class="bar" style="flex:1"><i style="width:${wk[i]/mx*100}%;background:${i===0?'var(--go)':'#94a3b8'}"></i></div><span style="flex:0 0 4.6rem;text-align:right;font-size:.8rem;line-height:1.2">${km(wk[i])}${hasH?`<br><small class="hint">고속 ${km(hs[i])}</small>`:''}</span></div>`).join('')}
    <p class="hint">최근 4주 누적 ${km(wk.reduce((s,x)=>s+x,0))} · 주평균 ${km(chronic)} · 뛴 거리 기준</p></div>`;
}

// [추가] 2026-11-25 경기 중 자주 누르는 버튼을 촬영 폰 상태 바로 아래에 모은다(스크롤 없이):

function camQuickHtml(c,stale){
  const inApp=!!(window.MatchCam&&typeof MatchCam.event==='function');   // 골고 캠 안의 골고(촬영 폰 자신)

  const q=c.quarterFiles||0;
  // 같은 폰(골고 앱 0.8.1~ 이 이 폰에 골고 캠이 있고 촬영 폰 주소가 이 폰이라고 알려 줌): 카메라 화면 보기 = 골고 캠 열기

  }
  // [추가] 2026-11-25 유튜브에 올린 뒤 바로 지울 수 있게 촬영 폰 쿼터 영상 지우기도 여기에(확인 창)

// ---------- 운동장 네 점(2026-11-24) ----------
// 분석기가 경기 폴더 첫 장면을 cam/frame {jpg, w, h, position} 으로 보내고, 운영진이 그 위에서 네 점을 누르면
// cam/pitch {위치: {pts:[x1,y1..x4,y4](화면 비율), m:[..](운동장 m), w, h, ts}} 에 저장한다. 분석기는 다음 1분 파일부터 거리·속도를 계산한다.
// 배열 안 배열은 Firestore 가 막아서 평평한 배열로 둔다. x = 길이 방향(왼쪽 골라인 0), y = 폭 방향(카메라 쪽 터치라인 0)
const PITCH_MARKS=[['nl','가까운 왼쪽 코너',(w,h)=>[0,0]],['nh','가까운 쪽 하프라인 끝',(w,h)=>[w/2,0]],['nr','가까운 오른쪽 코너',(w,h)=>[w,0]],
  ['fl','먼 왼쪽 코너',(w,h)=>[0,h]],['fh','먼 쪽 하프라인 끝',(w,h)=>[w/2,h]],['fr','먼 오른쪽 코너',(w,h)=>[w,h]],['cc','센터 서클 가운데',(w,h)=>[w/2,h/2]]];
const POS_NAME={halfline:'하프라인',corner:'코너',other:'기타'};
function pitchSetHtml(){
  const f=ST.camFrame,pos=(f&&f.position)||(ST.cam&&ST.cam.pos)||'halfline',saved=(ST.camPitch||{})[pos];   // 첫 장면이 없으면 촬영 폰이 보고한 위치

  const pk=ST.pk;
  if(!pk)return head+`<p class="${saved?'':'bad'}" style="margin:.2rem 0">${saved?`저장됨: 길이 ${saved.w}m × 폭 ${saved.h}m (${new Date(saved.ts).toLocaleDateString()})`:'아직 없어요. 거리·속도가 빈칸으로 나와요.'}</p>
    <div style="position:relative">${pitchImg(f,saved?saved.pts:null)}</div><div class="row" style="margin-top:.5rem"><button class="pri" data-act="pkStart">${saved?'네 점 다시 찍기':'네 점 찍기'}</button></div>`;
  const i=pk.pts.length/2,done=i>=4;

    ${done?'':`<div class="row">${PITCH_MARKS.map(m=>`<button data-pkmark="${m[0]}" class="${pk.marks[i]===m[0]?'on':''}" ${pk.marks.slice(0,i).includes(m[0])?'disabled':''}>${esc(m[1])}</button>`).join('')}</div><p class="hint" style="margin:.2rem 0">화면에 안 보이는 점은 다른 점(하프라인 끝, 센터 서클 가운데)으로 바꿔 고르세요. 한 줄에 세 점이 놓이지 않게 고르세요.</p>`}

    <div class="row" style="margin-top:.5rem"><button data-act="pkUndo" ${pk.pts.length?'':'disabled'}>한 점 지우기</button><button data-act="pkCancel">취소</button><button class="pri" data-act="pkSave" ${done?'':'disabled'}>저장</button></div>`;
}
function pitchImg(f,pts,clickable){
  const dots=[];for(let i=0;pts&&i<pts.length/2;i++)dots.push(`<span style="position:absolute;left:${pts[i*2]*100}%;top:${pts[i*2+1]*100}%;transform:translate(-50%,-50%);width:1.4rem;height:1.4rem;border-radius:50%;background:#e53935;color:#fff;font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff">${i+1}</span>`);
  return `<img id="${clickable?'pkImg':''}" src="data:image/jpeg;base64,${f.jpg}" alt="촬영 화면" style="width:100%;display:block;border-radius:.5rem;${clickable?'cursor:crosshair':''}">${dots.join('')}`;
}
function pkStart(){const f=ST.camFrame,pos=(f&&f.position)||(ST.cam&&ST.cam.pos)||'halfline',s=(ST.camPitch||{})[pos];
  // 하프라인 옆에서는 가까운 코너가 잘리기 쉬워서 하프라인 끝·먼 코너·센터 서클을 먼저 권한다
  ST.pk={pts:[],marks:pos==='halfline'?['nh','fl','fr','cc']:['nl','nr','fr','fl'],w:(s&&s.w)||90,h:(s&&s.h)||60};render()}

  const m=[];pk.marks.forEach(k=>m.push(...PITCH_MARKS.find(x=>x[0]===k)[2](w,h)));

}

const NORM_NAMES={mpm:'분당 거리 m',vol:'운동량 m/쿼터',cov:'활동 범위 %',agi:'방향 전환 회/쿼터',stm:'스태미나',hhk:'후반 고강도 유지',apo:'박스 진입 회/쿼터',
  top:'최고 속도 km/h',hsr:'고속 거리 m/쿼터',spr:'전력 질주 거리 m/쿼터',spf:'스프린트 회/쿼터',acc:'가속 회/쿼터',brk:'감속 회/쿼터',rsa:'반복 스프린트 회/쿼터'};
const median=a=>{if(!a.length)return null;const b=a.slice().sort((x,y)=>x-y),m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2};
// 최근 1개월(어제까지) 회원별 기록 → 나이대별 중간값. 3명 미만인 나이대는 인접 나이대와 묶어 매끄럽게
function proposeNorm(){
  const today=todayStr(),from=addDays(today,-CARD_DAYS),R=allRows().filter(r=>r.a.date>=from&&r.a.date<today),by={};
  R.forEach(r=>{(by[r.pid]=by[r.pid]||[]).push(r)});
  const F={};CARD_AX[1].forEach(ax=>ax.subs.forEach(su=>{const k=su.ab||su.k;if(AGE_NORM[k]&&!F[k])F[k]=su.f}));
  const S={};AGE_BANDS.forEach(b=>S[b]={});
  Object.entries(by).forEach(([pid,rs])=>{const L=rs.map(r=>r.s),s=mergeStats(L);s._games=new Set(rs.map(r=>r.a.date)).size;
    const en=L.map(x=>endur(mergeStats([x]))).filter(nz);s._end=en.length?mean(en):null;
    const hh=L.map(x=>Array.isArray(x.hsrHalves)&&x.hsrHalves[0]>0?x.hsrHalves[1]/x.hsrHalves[0]:null).filter(nz);s._hh=hh.length?mean(hh):null;
    const b=ageOf(pid)||AGE_DEFAULT;for(const k in F){const v=F[k](s);if(nz(v))(S[b][k]=S[b][k]||[]).push(v)}});
  const out={},cnt={};
  for(const k in AGE_NORM){out[k]={};AGE_BANDS.forEach((b,i)=>{let L=S[b][k]||[];cnt[b]=Math.max(cnt[b]||0,L.length);
    if(L.length<3)L=[...L,...((S[AGE_BANDS[i-1]]||{})[k]||[]),...((S[AGE_BANDS[i+1]]||{})[k]||[])];
    const m=median(L);out[k][b]=m==null?normOf(k,b):+m.toFixed(Math.abs(m)>=100?0:Math.abs(m)>=10?1:2)})}
  return {norm:out,cnt,n:Object.keys(by).length};
}

async function bind(){
  await ST.sdkP;   // 쓰기는 Firebase 라이브러리가 준비된 뒤
  const n=ST.confirm,F=ST.F,ref=F.doc(ST.db,'pub',ST.conf.code,'bind',n.id);
  try{
    const s=await F.getDoc(ref);
    if(s.exists()&&s.data().dev!==DEV){ST.confirm=null;ST.me=null;say(`${n.name} 님은 이미 다른 휴대폰에 등록돼 있어요. 휴대폰을 바꿨다면 운영자에게 등록 해제를 부탁해 주세요.`,'bad');return}
    if(!s.exists())await F.setDoc(ref,{dev:DEV,name:n.name,ts:Date.now()});
    ST.me={pid:n.id,name:n.name};saveMe(ST.me);ST.confirm=null;say(`${n.name} 님으로 등록했어요.`,'ok');
  }catch(e){ST.confirm=null;ST.me=null;say('등록하지 못했어요. 인터넷 연결을 확인해 주세요.','bad')}
}
const CAM_MSG={start:'녹화 시작을 보냈어요.',stop:'녹화 정지를 보냈어요.',makeQuarter:'쿼터 영상 만들기를 보냈어요.',upload:'업로드 설정을 보냈어요.',lens:'렌즈 설정을 보냈어요.',position:'촬영 위치를 보냈어요.',deleteQuarters:'쿼터 영상 지우기를 보냈어요.'};
async function camCmd(op,v){
  // 모바일 데이터 업로드는 사용량을 알리고 확인받는다(앱 화면과 같은 안내)
  // 녹화 정지는 실수로 누르면 경기가 끊기니 확인받는다(2026-11-25)
  if(op==='stop'&&!confirm('촬영 폰의 녹화를 멈출까요?'))return;
  // 촬영 폰의 쿼터 영상 지우기(2026-11-25, 앱 0.7.3~): 되돌릴 수 없으니 확인받는다
  if(op==='deleteQuarters'&&!confirm(`촬영 폰에 남은 쿼터 영상 ${ST.cam&&ST.cam.quarterFiles||''}개를 지울까요?\n\n유튜브에 다 올렸는지(유튜브 앱 → 내 동영상, "처리 완료") 먼저 확인하세요. 지운 영상은 되돌릴 수 없어요.\n분석용 1분 파일과 기록 파일은 지우지 않아요.`))return;
  if(op==='upload'&&v==='WITH_MOBILE'&&!confirm('와이파이가 없을 때 모바일 데이터로 분석용 영상을 올립니다.\n\n예상 사용량: 쿼터(25분)당 약 3.7GB, 하루 8쿼터면 약 30GB\n무제한 요금제도 기본 제공량을 넘으면 속도가 느려질 수 있어요.\n\n모바일 데이터로 올릴까요?'))return;
  await ST.sdkP;   // 쓰기는 Firebase 라이브러리가 준비된 뒤
  const F=ST.F,d={op,q:null,ts:Date.now()};if(v!=null)d.v=v;
  try{await F.setDoc(F.doc(ST.db,'pub',ST.conf.code,'cam','cmd'),d);say((CAM_MSG[op]||'명령을 보냈어요.')+' 촬영 폰이 5초 안에 받아요.','ok')}catch(e){say('보내지 못했어요.','bad')}
}
async function addMark(){
  await ST.sdkP;   // 쓰기는 Firebase 라이브러리가 준비된 뒤
  const t=($('markTxt')||{}).value||'';const F=ST.F,a=curAna(),now=Date.now();
  // 지금 진행 중인 쿼터: 오늘 분석 문서 중 시작 시각이 지난 마지막 것(없으면 비움)
  const live=sortedAna().filter(x=>x.startMs&&x.startMs<=now&&(!x.endMs||x.endMs>=now-5*6e4)).pop();
  try{await F.setDoc(F.doc(ST.db,'pub',ST.conf.code,'cam','marks'),{list:F.arrayUnion({ts:now,q:live?live.q:null,text:t.trim()||'장면',by:ST.user?ST.user.email:DEV})},{merge:true});say(`${hm(now)} 장면을 표시했어요.`,'ok')}catch(e){say('표시하지 못했어요.','bad')}
}
async function saveYt(){
  await ST.sdkP;   // 쓰기는 Firebase 라이브러리가 준비된 뒤
  const F=ST.F;let n=0;
  for(const el of document.querySelectorAll('[data-yt]')){const a=ST.ana.find(x=>x.id===el.dataset.yt);const v=el.value.trim();if(!a||v===((a.video&&a.video.yt)||''))continue;
    if(v&&!ytId(v)){say(`${a.q}쿼터 링크가 유튜브 주소가 아니에요.`,'bad');return}
    try{await F.updateDoc(F.doc(ST.db,'pub',ST.conf.code,'ana',a.id),{'video.yt':v||null,updatedMs:Date.now()});n++}catch(e){say('저장하지 못했어요.','bad');return}}
  say(n?`영상 링크 ${n}개를 저장했어요.`:'바뀐 링크가 없어요.','ok');
}
async function savePid(){
  await ST.sdkP;   // 쓰기는 Firebase 라이브러리가 준비된 뒤
  const a=curAna();if(!a)return;const F=ST.F,ref=F.doc(ST.db,'pub',ST.conf.code,'ana',a.id);
  try{
    // 저장 직전 최신 문서를 다시 읽어 tracks 만 고친다(분석기가 그사이 바꾼 값을 덮지 않게)
    // 같은 사람을 두 선수에 고르지 않았는지 먼저 본다
    // [수정] 2026-11-25 같은 사람이 중간에 끊겨 두 번호로 나뉘는 건 정상이라 막지 않고 확인만 받는다
    const pick={},dups=[];document.querySelectorAll('[data-pid]').forEach(el=>{const v=el.value;if(!v||v==='__new')return;if(pick[v]&&!dups.includes(v))dups.push(v);pick[v]=1});
    if(dups.length){const nm=v=>v.startsWith('lbl:')?v.slice(4):(((ST.P.names||[]).find(x=>x.id===v)||{}).name||v);
      if(!confirm(`${dups.map(nm).join(', ')} 님이 두 선수 이상에 골라져 있어요.\n같은 사람이 중간에 끊겨 번호가 나뉜 거면 확인, 잘못 고른 거면 취소를 누르세요.`))return}
    const s=await F.getDoc(ref);if(!s.exists())return;const tr=(s.data().tracks||[]).map(t=>Object.assign({},t));let n=0;
    document.querySelectorAll('[data-pid]').forEach(el=>{const t=tr.find(x=>String(x.tid)===el.dataset.pid);if(!t)return;let v=el.value||null;if(v==='__new')v=null;
      const cur=ownerOf(a,t.tid)||(t.lbl?'lbl:'+t.lbl:null);if(v===cur)return;
      // 직접 입력한 이름은 회원 기록에 들어가지 않게 pid 가 아니라 lbl 에 둔다(학습용 정답)
      if(v&&v.startsWith('lbl:')){t.pid=null;t.lbl=v.slice(4);t.by='admin'}else{t.pid=v;t.lbl=null;t.by=v?'admin':null}n++});
    if(!n){say('바뀐 이름이 없어요.','ok');return}
    await F.updateDoc(ref,{tracks:tr,updatedMs:Date.now()});if(ST.pend)delete ST.pend[a.id];
    const la=ST.ana.find(x=>x.id===a.id);if(la)la.tracks=tr;say(`이름 ${n}개를 고쳤어요.`,'ok');render();
  }catch(e){say('저장하지 못했어요.','bad')}
}
async function login(){
  const A=ST.A;if(!A){say('로그인을 준비하는 중이에요. 잠시 뒤 다시 눌러 주세요.','bad');return}
  try{
    // 촬영 앱 안 웹 화면: 앱이 폰의 구글 계정으로 받은 토큰을 넘겨준다
    if(window.MatchCam&&MatchCam.googleIdToken){const tk=MatchCam.googleIdToken();if(tk){await A.signInWithCredential(ST.auth,A.GoogleAuthProvider.credential(tk));return}}
    const p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    try{await A.signInWithPopup(ST.auth,p)}catch(e){if(e&&/popup-blocked|operation-not-supported/.test(e.code||''))await A.signInWithRedirect(ST.auth,p);else throw e}
  }catch(e){if(!/popup-closed|cancelled/.test((e&&e.code)||''))say('로그인하지 못했어요. '+((e&&e.code)||''),'bad')}
}
async function checkAdmin(){
  ST.admin=false;if(!ST.user||!ST.user.email)return render();
  try{const s=await ST.F.getDoc(ST.F.doc(ST.db,'admins',ST.user.email.toLowerCase()));ST.admin=s.exists()}catch(e){ST.admin=false}
  render();
}

// ---------- 빠른 불러오기: Firestore REST(필요한 칸만) ----------
// 첫 화면은 Firebase 라이브러리(압축 전 약 1MB)를 기다리지 않고 REST 로 바로 읽는다. 쿼리에서 칸을 골라 첫 장면 사진(frame.jpg)은 받지 않는다.
// 라이브러리는 화면을 띄운 뒤 뒤에서 받아 쓰기·로그인·실시간에만 쓴다(ST.sdkP)
const RB=()=>`https://firestore.googleapis.com/v1/projects/${ST.conf.cfg.projectId}/databases/(default)/documents`;
function fsVal(v){if(!v)return null;if('nullValue' in v)return null;if('stringValue' in v)return v.stringValue;if('integerValue' in v)return +v.integerValue;if('doubleValue' in v)return v.doubleValue;
  if('booleanValue' in v)return v.booleanValue;if('timestampValue' in v){const ms=Date.parse(v.timestampValue);return {toMillis:()=>ms}}
  if('arrayValue' in v)return (v.arrayValue.values||[]).map(fsVal);if('mapValue' in v)return fsMap(v.mapValue.fields||{});return null}
function fsMap(f){const o={};for(const k in f)o[k]=fsVal(f[k]);return o}
const fsDoc=d=>Object.assign({id:decodeURIComponent(d.name.split('/').pop())},fsMap(d.fields||{}));
async function restGet(path,mask){
  const u=`${RB()}/${path}?key=${ST.conf.cfg.apiKey}${(mask||[]).map(m=>'&mask.fieldPaths='+encodeURIComponent(m)).join('')}`;
  const r=await fetch(u);if(r.status===404)return null;if(!r.ok)throw new Error('rest '+r.status);const j=await r.json();return fsDoc(j)}
async function restQuery(parent,sq){
  const r=await fetch(`${RB()}${parent?'/'+parent:''}:runQuery?key=${ST.conf.cfg.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({structuredQuery:sq})});
  if(!r.ok)throw new Error('rest '+r.status);const j=await r.json();return j.filter(x=>x.document).map(x=>fsDoc(x.document))}
const fld=a=>a.map(f=>({fieldPath:f}));
const eqDate=d=>({fieldFilter:{field:{fieldPath:'date'},op:'EQUAL',value:{stringValue:d}}});
// 분석 문서에서 받는 칸(첫 장면 사진 frame.jpg 는 빼고 크기만)
const ANA_LIGHT=['v','date','q','startMs','endMs','source','video','tracks','stats','team','pitch','board','lineup','updatedMs','frame.w','frame.h','ourTeam'];   // ourTeam: 상대팀 경기에서 운영진이 고른 우리 팀(2026-11-25)
const P_CODE=()=>`pub/${ST.conf.code}`;
// 경기 목록: 날짜·쿼터 번호·시작 시각만
async function loadIndex(){
  const L=await restQuery(P_CODE(),{from:[{collectionId:'ana'}],select:{fields:fld(['date','q','startMs','updatedMs'])},orderBy:[{field:{fieldPath:'startMs'},direction:'DESCENDING'}],limit:300});
  ST.idx=L.filter(x=>x.date).map(x=>({id:x.id,date:x.date,q:x.q,startMs:x.startMs,updatedMs:x.updatedMs}));return ST.idx;
}
// 날짜별 상세(사진 빼고). 이미 받은 날짜는 다시 받지 않는다(force 면 다시)
async function loadDates(ds,force){
  ds=[...new Set(ds)].filter(d=>force||!ST.loadedDates.has(d));if(!ds.length)return;
  const R=await Promise.all(ds.map(d=>restQuery(P_CODE(),{from:[{collectionId:'ana'}],select:{fields:fld(ANA_LIGHT)},where:eqDate(d)})));
  const m=new Map(ST.ana.map(a=>[a.id,a]));R.flat().forEach(a=>{const o=m.get(a.id);if(o&&o.frame&&o.frame.jpg&&a.frame)a.frame.jpg=o.frame.jpg;m.set(a.id,a)});
  ST.ana=[...m.values()];ds.forEach(d=>ST.loadedDates.add(d));
  await Promise.all(R.flat().map(a=>loadClaims(a.id,true)));
}
// 내 카드(최근 1개월·시즌 추이)에 필요한 날짜를 모두. 한 번만
async function loadAllDates(){if(ST.allP)return ST.allP;ST.allP=loadDates((ST.idx||[]).map(x=>x.date)).then(()=>{ST.allLoaded=true;render()});return ST.allP}
// 첫 장면 사진: "전체 장면에서 보기"를 열거나 선수 사진(crop)이 없어서 첫 장면에서 잘라야 할 때만
async function loadFrame(id){
  if(ST.frameLd[id])return;ST.frameLd[id]=1;
  try{const d=await restGet(`${P_CODE()}/ana/${encodeURIComponent(id)}`,['frame']);const a=ST.ana.find(x=>x.id===id);if(a&&d&&d.frame){a.frame=Object.assign({},a.frame,d.frame);render()}}catch(e){ST.frameLd[id]=0}
}
// 새 쿼터·고친 분석 확인: 1분마다 목록만 다시 받아(화면이 보일 때만), 새로 생기거나 updatedMs 가 바뀐 문서의 날짜만 다시 받는다
async function pollIndex(){
  if(document.hidden||!ST.conf||!ST.idx)return;
  try{const old=new Set(ST.idx.map(x=>x.id)),L=await loadIndex(),ch=L.filter(x=>{if(!old.has(x.id))return true;const a=ST.ana.find(y=>y.id===x.id);return a&&x.updatedMs&&a.updatedMs!==x.updatedMs});
    const ds=ch.map(x=>x.date).filter(d=>ST.loadedDates.has(d)||d===L[0].date);if(ds.length){await loadDates(ds,true);render()}}catch(e){}
}
// 옛 방식 claim/{tid} 와 새 방식 mine/{pid}(같은 날 바꿀 수 있음)를 함께 읽는다(REST)
async function loadClaims(id,quiet){
  try{const par=`${P_CODE()}/ana/${encodeURIComponent(id)}`;const [qc,qm]=await Promise.all([restQuery(par,{from:[{collectionId:'claim'}]}),restQuery(par,{from:[{collectionId:'mine'}]}).catch(()=>[])]);
    const m={};qc.forEach(d=>{m[d.id]=d});ST.claims[id]=m;const mm={};qm.forEach(d=>{mm[d.id]=d});ST.mine[id]=mm;if(!quiet)render()}catch(e){}
}
async function start(){
  ST.conf=readConf();ST.me=loadMe();
  ST.linkAdmin=!!load('jogi-sync');   // 기존 연결 링크(축구회 코드)로 연결된 운영진 휴대폰
  // 예전 운영진 주소(member.html?admin)로 들어오면 메뉴를 한 번 열어 둔다(안내에는 쓰지 않음)
  ST.menuOpen=/[?&]admin(=|&|$)/.test(location.search);
  render();if(!ST.conf){ST.sdkP=loadSdk(DEF_CFG);return}
  // 1) 첫 화면: 명단, 경기 목록, 가장 최근 경기 상세(사진 빼고)를 REST 로 한꺼번에
  try{
    const [P,idx]=await Promise.all([restGet(P_CODE()),loadIndex()]);
    if(idx.length)await loadDates([idx[0].date]);
    ST.P=P;if(!ST.P)ST.err='회원 화면이 아직 준비되지 않았어요. 운영자에게 알려 주세요.';
    ST.tFirst=Math.round(performance.now());render();
  }catch(e){ST.err='연결하지 못했어요. 인터넷 연결을 확인해 주세요.';render();return}
  // 2) 화면을 띄운 뒤 뒤에서: 내 습관 프로필, 등록 확인, 점수 기준, 새 쿼터 확인, Firebase 라이브러리(쓰기·로그인용)
  const code=ST.conf.code;
  if(ST.me)restGet(`${P_CODE()}/prof/${ST.me.pid}`).then(d=>{if(d){ST.prof[ST.me.pid]=d;render()}}).catch(()=>{});
  if(ST.me&&!ST.test)restGet(`${P_CODE()}/bind/${ST.me.pid}`).then(d=>{if(!d||d.dev!==DEV){const nm=ST.me.name;ST.me=null;saveMe(null);say(`${nm} 님 등록이 해제됐어요. 이름을 다시 골라 주세요.`,'bad')}}).catch(()=>{});
  // 운영진이 적용한 나이대별 점수 기준(없으면 코드의 AGE_NORM)
  restGet(`${P_CODE()}/conf/norm`).then(d=>{ST.norm=(d&&d.norm)||null;render()}).catch(()=>{});
  setInterval(pollIndex,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollIndex()});
  ST.sdkP=loadSdk(ST.conf.cfg);
}
// Firebase 라이브러리: 쓰기(나 찾기·등록·관리), 로그인, 촬영 폰 실시간 상태에만 쓴다
async function loadSdk(cfg){
  try{
    const A=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`);
    const F=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`);
    const app=A.getApps().find(a=>a.name==='bz-m')||A.initializeApp(cfg,'bz-m');
    ST.F=F;ST.db=F.getFirestore(app);initAuth(app);
    if(ST.conf){const code=ST.conf.code;
      F.onSnapshot(F.doc(ST.db,'pub',code,'cam','state'),s=>{ST.cam=s.exists()?s.data():null;if(ST.tab==='admin')render()},()=>{});
      // 자동 분석기 상태(Colab 1순위 / Kaggle 2순위, 2026-11-23)
      F.onSnapshot(F.doc(ST.db,'pub',code,'cam','ana'),s=>{ST.anaRun=s.exists()?s.data():null;if(ST.tab==='admin')render()},()=>{});
      // 운동장 네 점: 분석기가 보낸 첫 장면과 저장된 네 점(2026-11-24). 네 점을 찍는 중에는 화면을 다시 그리지 않는다
      F.onSnapshot(F.doc(ST.db,'pub',code,'cam','gpu'),s=>{ST.gpu=s.exists()?s.data():null;if(ST.tab==='admin'&&!ST.pk)render()},()=>{});
      F.onSnapshot(F.doc(ST.db,'pub',code,'cam','frame'),s=>{ST.camFrame=s.exists()?s.data():null;if(ST.tab==='admin'&&!ST.pk)render()},()=>{});
      F.onSnapshot(F.doc(ST.db,'pub',code,'cam','pitch'),s=>{ST.camPitch=s.exists()?s.data():null;if(ST.tab==='admin'&&!ST.pk)render()},()=>{});
      F.onSnapshot(F.doc(ST.db,'pub',code,'cam','marks'),s=>{ST.marks=(s.exists()&&s.data().list)||[];if(ST.tab==='admin')render()},()=>{});
      setInterval(()=>{if(ST.tab==='admin')render()},30000)}
    return true;
  }catch(e){return false}
}
async function initAuth(app){
  try{
    const A=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`);
    ST.A=A;ST.auth=A.getAuth(app);
    A.getRedirectResult(ST.auth).catch(()=>{});
    A.onAuthStateChanged(ST.auth,u=>{ST.user=u;checkAdmin()});
  }catch(e){}
}
start();
</script>
