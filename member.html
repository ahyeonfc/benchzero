<body>
<header><h1><span id="title">벤치제로</span><small id="who"></small></h1><div class="tabs" id="tabs"></div></header>
<main><div id="app"><p class="ld">불러오는 중…</p></div></main>
<script src="qrcode.js"></script>
<script type="module">
// 벤치제로 회원 화면: 쿼터 영상, 나 찾기, 내 경기 분석, 선수 카드, 순위, 지난 경기 비교, 부하 관리
// 관리 메뉴: 구글 로그인한 운영진 또는 기존 연결 링크로 연결된 휴대폰에만 보인다
const FBV='13.4.0';
const DEF_CFG={"apiKey":"AIzaSyDvJZfjmVWOMXzNAgYciQC80qDx8n3iP6E","authDomain":"benchzero-50f14.firebaseapp.com","projectId":"benchzero-50f14","storageBucket":"benchzero-50f14.firebasestorage.app","messagingSenderId":"279178405228","appId":"1:279178405228:web:11cefb680a5a1c85837f49"};
const TEST_PREFIX='matchcamtest';   // 시험용 코드는 이 휴대폰에 저장하지 않는다(실제 출석 등록을 건드리지 않게)
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hm=t=>{const d=new Date(t);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const store=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const DEV=(()=>{try{let d=localStorage.getItem('bz-dev');if(!d){d='m'+Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>b.toString(36)).join('').slice(0,14);localStorage.setItem('bz-dev',d)}return d}catch(e){return 'm'+Math.random().toString(36).slice(2)}})();
const DN=['일','월','화','수','목','금','토'];
const dLabel=ds=>{const d=new Date(ds+'T00:00');return `${d.getMonth()+1}/${d.getDate()}(${DN[d.getDay()]})`};
const km=m=>m==null?'-':(m>=1000?(m/1000).toFixed(2)+'km':Math.round(m)+'m');
const pct=v=>v==null?'-':Math.round(v>1?v:v*100)+'%';

// 상태
const ST={conf:null,test:false,me:null,P:null,F:null,db:null,auth:null,A:null,user:null,admin:false,linkAdmin:false,
  ana:[],claims:{},sel:null,tab:'game',rank:'q',cam:null,marks:[],msg:'',mcls:'',q:'',confirm:null,err:'',mine:{},crops:{},cropLd:{},sugNo:{},reFind:{},pick:{},fteam:{},att:{},more:{}};

// 축구회 코드 읽기: 출석(checkin.html)과 같은 저장 키(bz-ci, bz-me)를 쓴다
function readConf(){
  const h=location.hash;let code=null,cfg=DEF_CFG;
  const s=h.match(/^#((?:ci-)?[a-z0-9-]{16,})$/i);if(s)code=s[1];
  const m=h.match(/#c=([^&]+)/);
  if(m){try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));if(o.cfg&&o.code){code=o.code;cfg=o.cfg}}catch(e){}}
  if(code){
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    if(code.startsWith(TEST_PREFIX)){ST.test=true;try{sessionStorage.setItem('bz-mtest',code)}catch(e){}return{cfg,code}}
    const o={cfg,code};store('bz-ci',o);const old=load('bz-ci-code');if(old&&old!==code)store('bz-me',null);store('bz-ci-code',code);return o;
  }
  try{const t=sessionStorage.getItem('bz-mtest');if(t){ST.test=true;return{cfg:DEF_CFG,code:t}}}catch(e){}
  const c=load('bz-ci');if(c&&c.code)return c;
  // 운영진 휴대폰: 관리 화면에 저장된 회원 체크인 코드를 쓴다
  const S=load('jogi-rotation-v2');if(S&&S.ci&&S.ci.code)return{cfg:DEF_CFG,code:S.ci.code};
  return null;
}
function loadMe(){if(ST.test){try{return JSON.parse(sessionStorage.getItem('bz-mtest-me')||'null')}catch(e){return null}}return load('bz-me')}
function saveMe(v){if(ST.test){try{v?sessionStorage.setItem('bz-mtest-me',JSON.stringify(v)):sessionStorage.removeItem('bz-mtest-me')}catch(e){}return}store('bz-me',v)}

function say(t,c){ST.msg=t||'';ST.mcls=c||'';render()}
const nameOf=pid=>{const n=(ST.P&&ST.P.names||[]).find(x=>x.id===pid);return n?n.name:(pid||'')};

// 분석 문서 도우미
const docId=a=>a.id;
const sortedAna=()=>ST.ana.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.q||0)-(b.q||0));
const dates=()=>[...new Set(sortedAna().map(a=>a.date))].reverse();
function tidsOf(a,pid){return (a.tracks||[]).map(t=>String(t.tid)).filter(tid=>ownerOf(a,tid)===pid)}
// ---------- 분석 계산 ----------
const nz=v=>v!=null&&typeof v==='number'&&!isNaN(v);
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
function sumObj(L,k){const o={};let any=false;L.forEach(s=>{const v=s[k];if(!v)return;any=true;for(const z in v)o[z]=(o[z]||0)+(v[z]||0)});return any?o:null}
function wObj(L,k){const LL=L.filter(s=>s[k]);if(!LL.length)return null;const o={};let W=0;LL.forEach(s=>{const w=s.mins||1;W+=w;for(const z in s[k])o[z]=(o[z]||0)+(s[k][z]||0)*w});for(const z in o)o[z]/=W;return o}
function wAvg(L,k){const LL=L.filter(s=>nz(s[k]));if(!LL.length)return null;let W=0,t=0;LL.forEach(s=>{const w=s.mins||1;W+=w;t+=s[k]*w});return t/W}
// 분석기가 안 준 값 중 계산할 수 있는 것만 채운다
// 카메라 방식은 순간 오차로 최고 속도가 튈 수 있어 34km/h 를 넘는 값은 오류로 보고 버린다
const VMAX_OK=34,okV=v=>nz(v)&&v>0&&v<=VMAX_OK;
function fillStat(s){s=Object.assign({},s);if(!okV(s.vmaxKmh))s.vmaxKmh=null;if(!nz(s.workRate)&&s.mins)s.workRate=s.distM/s.mins;if(!nz(s.avgKmh)&&s.mins)s.avgKmh=s.distM/s.mins*0.06;return s}
// 여러 기록(같은 쿼터의 여러 추적 번호, 또는 하루의 여러 쿼터)을 하나로 합친다
function mergeStats(L){
  L=L.filter(Boolean);if(!L.length)return null;
  if(L.length===1){const s=fillStat(L[0]);s._segs=s.speedSeries?[s.speedSeries.length]:[];s._d5=s.dist5&&s.dist5.length?[s.dist5]:[];s._d5m=s._d5.length?[s.mins]:[];return s}
  const r={},has=k=>L.some(s=>nz(s[k]));
  ['mins','distM','sprints','hsrM','sprintM','accels','decels','turns','rsa','boxEntries'].forEach(k=>{if(has(k))r[k]=L.reduce((t,s)=>t+(s[k]||0),0)});
  const z=sumObj(L,'zones');if(z)r.zones=z;const zs=sumObj(L,'zoneSec');if(zs)r.zoneSec=zs;
  {const v=L.map(s=>s.vmaxKmh).filter(okV);r.vmaxKmh=v.length?Math.max(...v):null}
  ['coverPct','devM','nearMate','ownHalf','lineDevM'].forEach(k=>{const v=wAvg(L,k);if(v!=null)r[k]=v});
  ['thirds','lanes','dirs','v2'].forEach(k=>{const v=wObj(L,k);if(v)r[k]=v});
  if(has('hiRatio')){const d=L.reduce((t,s)=>t+(s.distM||0),0);r.hiRatio=d?L.reduce((t,s)=>t+(s.hiRatio||0)*(s.distM||0),0)/d:0}
  const ss=L.filter(s=>s.speedSeries&&s.speedSeries.length);r.speedSeries=ss.length?[].concat(...ss.map(s=>s.speedSeries)):null;r._segs=ss.map(s=>s.speedSeries.length);
  {const H=L.filter(s=>Array.isArray(s.hsrHalves));if(H.length)r.hsrHalves=[H.reduce((t,s)=>t+(s.hsrHalves[0]||0),0),H.reduce((t,s)=>t+(s.hsrHalves[1]||0),0)]}
  r._d5=L.filter(s=>s.dist5&&s.dist5.length).map(s=>s.dist5);r._d5m=L.filter(s=>s.dist5&&s.dist5.length).map(s=>s.mins);
  r.sprintPaths=[].concat(...L.map(s=>s.sprintPaths||[]));
  const hs=L.filter(s=>s.heat&&s.heat.length===96);if(hs.length){const h=new Array(96).fill(0);hs.forEach(s=>s.heat.forEach((v,i)=>h[i]+=v*(s.mins||1)));const mx=Math.max(...h,1e-9);r.heat=h.map(v=>v/mx)}
  const b=L.reduce((p,s)=>(s.mins||0)>(p.mins||0)?s:p,L[0]);r.avg=b.avg;r.board=b.board;
  return fillStat(r);
}
function statOf(a,pid){return mergeStats(tidsOf(a,pid).map(t=>a.stats&&a.stats[t]))}
// 사람별 기록 모음: 전체 분석 문서에서 pid 로 묶는다
function allRows(){const out=[];sortedAna().forEach(a=>{const seen=new Set();(a.tracks||[]).forEach(t=>{const pid=ownerOf(a,t.tid);if(!pid||seen.has(pid))return;seen.add(pid);const s=statOf(a,pid);if(s)out.push({a,pid,s})})});return out}

function ytId(u){if(!u)return null;const m=String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(u)?u:null)}

// ---------- 나 찾기 ----------
// 주인 정하는 순서: 작전판·운영진이 tracks 에 붙인 pid > 회원이 고른 mine/{pid} > 옛 방식 claim/{tid}
const MINE_HOURS=18;   // 처음 고른 뒤 이 시간 안에는 본인이 바꿀 수 있다(Firestore 규칙과 같은 값)
function mineInv(a){const m=ST.mine[a.id];if(!m)return {};if(m._inv)return m._inv;const r={};for(const pid in m){if(pid[0]!=='_'&&m[pid]&&m[pid].tid!=null)r[String(m[pid].tid)]=pid}Object.defineProperty(m,'_inv',{value:r,enumerable:false});return r}
function ownerOf(a,tid){
  tid=String(tid);const t=(a.tracks||[]).find(x=>String(x.tid)===tid);if(t&&t.pid)return t.pid;
  const mp=mineInv(a)[tid];if(mp)return mp;
  const c=ST.claims[a.id]&&ST.claims[a.id][tid];if(c&&!(ST.mine[a.id]&&ST.mine[a.id][c.pid]))return c.pid;   // 새로 고른 사람이면 옛 claim 은 무시
  return null;
}
const tsMs=v=>v&&v.toMillis?v.toMillis():typeof v==='number'?v:null;
function teamColor(a,tm){return (a.team&&a.team[tm]&&a.team[tm].color)||{A:'#2563eb',B:'#dc2626'}[tm]||'#64748b'}
function posWords(p,P){const x=p[0]/P.w,y=p[1]/P.h;return (x<.38?'수비':x<.66?'중앙':'공격')+' '+(y<.34?'왼쪽':y<.67?'가운데':'오른쪽')}
// 선수 사진: 분석기가 올린 crop 사진, 없으면 첫 장면에서 그 사람 둘레를 잘라 보여 준다
function cropHtml(a,tid,cls){
  const c=ST.crops[a.id]&&ST.crops[a.id][tid],j=c&&c.jpgs&&c.jpgs[0];
  if(j)return `<img class="crop ${cls||''}" src="${j.startsWith('data:')?j:'data:image/jpeg;base64,'+j}" alt="선수 사진">`;
  const t=(a.tracks||[]).find(x=>String(x.tid)===String(tid)),f=a.frame;
  if(!t||!t.box||!f||!f.jpg)return `<div class="crop ${cls||''}"></div>`;
  const[x,y,w,h]=t.box,fw=f.w||16,fh=f.h||9,rh=Math.min(1,h*1.6),rw=Math.min(1,0.6*rh*fh/fw),l=Math.max(0,Math.min(1-rw,x+w/2-rw/2)),tp=Math.max(0,Math.min(1-rh,y+h/2-rh/2));
  const src=f.jpg.startsWith('data:')?f.jpg:'data:image/jpeg;base64,'+f.jpg;
  return `<div class="crop ${cls||''}" style="background-image:url(${src});background-size:${100/rw}% ${100/rh}%;background-position:${rw<1?l/(1-rw)*100:0}% ${rh<1?tp/(1-rh)*100:0}%"></div>`;
}
function bigCrops(a,tid){const c=ST.crops[a.id]&&ST.crops[a.id][tid],J=(c&&c.jpgs||[]).slice(0,3);
  return J.length?`<div class="bigc">${J.map(j=>`<img src="${j.startsWith('data:')?j:'data:image/jpeg;base64,'+j}" alt="선수 사진">`).join('')}</div>`:`<div class="bigc">${cropHtml(a,tid,'lg')}</div>`}
function findHtml(a){
  const me=ST.me.pid,tr=a.tracks||[],myT=tidsOf(a,me),P=pitchOf(a);
  if(!ST.crops[a.id])loadCrops(a.id);
  if(!tr.length)return `<p class="hint">이 쿼터는 아직 선수 분석이 안 됐어요.</p>`;
  // 1) 이미 찾음
  if(myT.length&&!ST.reFind[a.id]){
    const tid=myT[0],t=tr.find(x=>String(x.tid)===tid),mi=ST.mine[a.id]&&ST.mine[a.id][me];
    const by=t&&t.pid===me?(t.by==='admin'?'운영진이 정해 줬어요.':'작전판 배치로 자동으로 찾았어요.'):'내가 골랐어요.';
    // 내가 고른 경우: 새 방식(mine)은 처음 고른 뒤 MINE_HOURS 안, 옛 방식(claim)은 새로 고르면 덮이므로 언제든 바꿀 수 있다
    const ft=mi&&tsMs(mi.firstTs),can=mi?(!ft||Date.now()<ft+MINE_HOURS*36e5):!(t&&t.pid===me);
    return `<div class="found">${cropHtml(a,tid,'lg')}<div><p style="margin:0"><b>${esc(ST.me.name)} 님을 찾았어요</b></p><p class="hint">${by}</p>
      ${can?'<button data-act="refind">다른 사람이었어요</button>':`<p class="hint">틀렸으면 운영진에게 말해 주세요.</p>`}</div></div>`;
  }
  // 2) 자동 제안: 분석기가 같은 날 앞 쿼터 기록으로 tracks[].suggest 를 넣어 줌
  const sg=tr.find(t=>t.suggest&&t.suggest.pid===me&&!ownerOf(a,t.tid));
  if(sg&&!ST.sugNo[a.id]&&!ST.reFind[a.id])
    return `<div class="found">${cropHtml(a,sg.tid,'lg')}<div><p style="margin:0"><b>이번 쿼터에서는 이 사람이 ${esc(ST.me.name)} 님 같아요</b></p><p class="hint">앞 쿼터에서 찾은 모습과 비슷해요.</p>
      <div class="row" style="margin-top:.4rem"><button class="pri" data-act="sugYes" data-t="${esc(sg.tid)}">맞아요</button><button data-act="sugNo">아니에요</button></div></div></div>`;
  // 3) 사진에서 고르기
  if(ST.pick[a.id]){const tid=ST.pick[a.id],t=tr.find(x=>String(x.tid)===tid);
    return `${bigCrops(a,tid)}<p style="text-align:center;margin:.4rem 0"><span class="dot" style="background:${teamColor(a,t&&t.team)}"></span>${t&&t.team?t.team+'팀':''}</p>
      <div class="row"><button class="pri" data-act="mineYes" data-t="${esc(tid)}">이 사람이 나예요</button><button data-act="pickNo">다른 사람 보기</button></div>`}
  const teams=[...new Set(tr.map(t=>t.team).filter(Boolean))].sort(),ft=ST.fteam[a.id];
  const bp=a.board&&a.board[me];
  let C=tr.filter(t=>(!ft||t.team===ft)&&(!ownerOf(a,t.tid)||ownerOf(a,t.tid)===me));
  if(bp){const d=t=>{const s=a.stats&&a.stats[t.tid],p=s&&s.avg;return p?Math.hypot(p[0]-bp[0],p[1]-bp[1]):1e9};C=C.slice().sort((x,y)=>d(x)-d(y))}
  // 출석한 사람 수만큼만(팀을 골랐으면 팀 몫만) 먼저 보여 주고 나머지는 더 보기
  const att=ST.att[a.date]||0,lim=att?Math.ceil(att/(ft&&teams.length?teams.length:1))+1:99,show=ST.more[a.id]?C:C.slice(0,lim);
  return `<p class="hint" style="margin:0 0 .5rem">사진에서 <b>나</b>를 눌러 주세요. 같은 날에는 나중에 바꿀 수 있어요.</p>
    ${teams.length>1?`<p style="margin:0 0 .3rem;font-weight:700;font-size:.9rem">먼저 내 조끼 색을 고르세요</p><div class="seg">${teams.map(tm=>`<button data-fteam="${tm}" class="${ft===tm?'on':''}"><span class="dot" style="background:${teamColor(a,tm)}"></span>${tm}팀</button>`).join('')}<button data-fteam="" class="${!ft?'on':''}">전체</button></div>`:''}
    ${bp?`<p class="hint" style="margin:0 0 .4rem">작전판에서 <b>${posWords(bp,P)}</b> 자리였어요. 가까운 선수부터 보여요.</p>`:''}
    <div class="cands">${show.map(t=>`<button data-cand="${esc(t.tid)}" style="border-color:${teamColor(a,t.team)}" aria-label="${t.team||''}팀 선수">${cropHtml(a,t.tid)}</button>`).join('')||'<p class="hint">고를 수 있는 선수가 없어요.</p>'}</div>
    ${show.length<C.length?`<button data-act="more" style="width:100%;margin-top:.4rem">더 보기 (${C.length-show.length}명)</button>`:''}
    <details class="axh" style="margin-top:.5rem"><summary>전체 장면에서 보기</summary>${frameHtml(a)}</details>`;
}
// 전체 장면(보기 전용): 내 네모는 노란색
function frameHtml(a){
  const f=a.frame;if(!f||!f.jpg)return '<p class="hint">첫 장면이 없어요.</p>';
  const mine=new Set(tidsOf(a,ST.me.pid)),src=f.jpg.startsWith('data:')?f.jpg:'data:image/jpeg;base64,'+f.jpg;
  return `<div class="frame" style="aspect-ratio:${f.w||16}/${f.h||9}"><img src="${src}" alt="${a.q}쿼터 첫 장면">${(a.tracks||[]).map(t=>{const[x,y,w,h]=t.box||[0,0,0,0];return `<i class="bx ${t.team||''} ${mine.has(String(t.tid))?'me':''}" style="left:${x*100}%;top:${y*100}%;width:${w*100}%;height:${h*100}%"></i>`}).join('')}</div>`;
}
// 내가 고른 선수 저장: mine/{내 pid} = {tid, ts, firstTs}. 처음 고른 시각(firstTs)에서 MINE_HOURS 안에는 바꿀 수 있다
async function saveMine(a,tid){
  const me=ST.me.pid,o=ownerOf(a,tid);if(o&&o!==me){say(`${nameOf(o)} 님으로 정해진 선수예요.`,'bad');return}
  const F=ST.F,ref=F.doc(ST.db,'pub',ST.conf.code,'ana',a.id,'mine',me);
  try{const ex=await F.getDoc(ref);const now=F.serverTimestamp();

// 시즌 누적과 개인 최고 기록

function badgesHtml(D){
  const last=D[D.length-1],s=last.s,B=[],day=scopeRows('d',last.date);
  const recent=nowMs()-Date.parse(last.date+'T12:00')<7*864e5,when=recent?'이번 주':dLabel(last.date);
  const top=f=>{const L=day.filter(r=>nz(f(r.s)));return L.length>=2&&nz(f(s))&&L.every(r=>f(r.s)<=f(s))};
  if(top(x=>x.distM))B.push(['🏃',`${when} 최다 거리`,km(s.distM)]);
  if(top(x=>x.vmaxKmh))B.push(['⚡',`${when} 최고 속도`,s.vmaxKmh.toFixed(1)+'km/h']);
  if(top(x=>x.sprints))B.push(['🔥','스프린트왕',s.sprints+'회']);
  if(top(x=>x.workRate))B.push(['💪','최고 활동량',Math.round(s.workRate)+'m/분']);
  if(D.length>1){const P=D.slice(0,-1);
    if((s.vmaxKmh||0)>Math.max(...P.map(d=>d.s.vmaxKmh||0)))B.push(['🚀','최고 속도 개인 기록 갱신',s.vmaxKmh.toFixed(1)+'km/h']);
    if((s.distM||0)>Math.max(...P.map(d=>d.s.distM||0)))B.push(['📈','하루 거리 개인 기록 갱신',km(s.distM)])}
  let streak=0;for(const d of dates()){if(D.some(x=>x.date===d))streak++;else break}
  if(streak>=3)B.push(['📅',`${streak}경기 연속 출전`,'']);
  const qn=sortedAna().filter(a=>a.date===last.date).length;if(qn>=3&&last.q>=qn)B.push(['🛡️','전 쿼터 출전',qn+'쿼터']);
  const e=endur(s);if(nz(e)&&e>=0.97)B.push(['🔋','끝까지 지치지 않음','후반 거리 유지']);
  return `<div class="card"><h2>배지 · ${dLabel(last.date)}</h2>${B.length?`<div class="badges">${B.map(([i,t,v])=>`<div><span class="bi">${i}</span><b>${esc(t)}</b>${v?`<small>${esc(v)}</small>`:''}</div>`).join('')}</div>`:'<p class="hint">이번 경기에서 받은 배지가 없어요. 다음 경기에서 도전해 보세요!</p>'}</div>`;
}
function trendSvg(D,f,fmt,label,unit){
  const V=D.map(d=>f(d.s));if(V.filter(nz).length<1)return '';
  const W=320,H=96,pl=6,pr=6,pt=18,pb=16,n=D.length,vs=V.filter(nz),mx=Math.max(...vs),mn=Math.min(...vs),rg=mx-mn||1;
  const X=i=>n>1?pl+i/(n-1)*(W-pl-pr):W/2,Y=v=>pt+(1-(v-mn)/rg)*(H-pt-pb);
  const pts=V.map((v,i)=>nz(v)?`${X(i).toFixed(1)},${Y(v).toFixed(1)}`:null).filter(Boolean).join(' ');
  const pb_i=V.indexOf(mx),last=V[n-1],isPB=n>1&&pb_i===n-1;
  let g=`<polyline points="${pts}" fill="none" stroke="#16a34a" stroke-width="2"/>`;
  V.forEach((v,i)=>{if(nz(v))g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===pb_i?4.5:2.8}" fill="${i===pb_i?'#facc15':'#16a34a'}" stroke="${i===pb_i?'#a16207':'none'}"/>`});
  g+=`<text x="${Math.min(W-30,Math.max(30,X(pb_i)))}" y="${Y(mx)-7}" font-size="10" text-anchor="middle" fill="#a16207" font-weight="700">최고 ${fmt(mx)}</text>`;
  D.forEach((d,i)=>{if(n<=8||i%Math.ceil(n/8)===0||i===n-1)g+=`<text x="${X(i)}" y="${H-3}" font-size="8.5" text-anchor="${n>1&&i===0?'start':n>1&&i===n-1?'end':'middle'}" fill="var(--mute)">${md(d.date)}</text>`});
  return `<div class="trend"><p><b>${label}</b> <span class="hint">최근 ${nz(last)?fmt(last):'-'}${unit}</span>${isPB?' <span class="pill on">개인 최고 갱신</span>':''}</p><svg viewBox="0 0 ${W} ${H}" style="width:100%">${g}</svg></div>`;
}
function trendHtml(D){
  if(D.length<2)return `<div class="card"><h2>시즌 추이</h2><p class="hint">두 경기 이상 기록이 쌓이면 추이를 보여 드려요.</p></div>`;
  return `<div class="card"><h2>시즌 추이</h2>${trendSvg(D,s=>s.distM,v=>(v/1000).toFixed(1),'뛴 거리','km')}${trendSvg(D,s=>s.vmaxKmh,v=>v.toFixed(1),'최고 속도'+REF,'km/h')}${trendSvg(D,s=>s.sprints,v=>Math.round(v),'스프린트','회')}${trendSvg(D,s=>s.workRate,v=>Math.round(v),'분당 거리','m')}<p class="hint">노란 점이 개인 최고 기록(PB)이에요.</p></div>`;
}

function gameCmpHtml(D,date){

  const c=D[i],p=D[i-1],arrow=(v,q)=>!nz(v)||!nz(q)?'':v>q*1.03?' <span class="up">▲</span>':v<q*0.97?' <span class="dn">▼</span>':'';

    return `<tr class="${d.date===date?'me':''}"><td>${dLabel(d.date)}</td><td>${d.q}</td><td>${km(s.distM)}</td><td>${nz(s.workRate)?Math.round(s.workRate):'-'}${arrow(s.workRate,ps&&ps.workRate)}</td><td>${nz(s.vmaxKmh)?s.vmaxKmh.toFixed(1):'-'}${arrow(s.vmaxKmh,ps&&ps.vmaxKmh)}</td><td>${nz(s.sprints)?s.sprints:'-'}${arrow(perQ(s,s.sprints),ps&&perQ(ps,ps.sprints))}</td></tr>`}).join('')}</table>`;
  return `<h3>지난 경기와 비교</h3><p class="hint sd">이번 경기와 바로 앞 경기를 나란히 놓았어요. ▲▼는 더 좋아졌는지 나빠졌는지예요(쿼터 수가 달라 분당·쿼터당 값으로 비교).</p>${top}${tbl}`;
}
function loadHtml(D){

    else{msg=`적정해요. 최근 1주 부하는 4주 평균의 ${ratio.toFixed(2)}배예요.`;cls='ok'}}
  const L=['최근 1주','1주 전','2주 전','3주 전'],gx=nz(ratio)?Math.min(100,ratio/2*100):null;
  return `<div class="card"><h2>부하 관리</h2><p class="hint sd">최근 1주에 뛴 양을 4주 평균과 비교해요. 갑자기 많이 늘면 다치기 쉬워요.</p>

// 내 카드 탭: 선수 카드(최근 1개월), 시즌 누적·개인 최고, 시즌 추이, 배지, 부하 관리
function mineHtml(){
  const D=dayStats(ST.me.pid);
  if(!D.length)return `<div class="card"><h2>${esc(ST.me.name)} 님 선수 카드</h2><p class="hint">아직 내 기록이 없어요. 경기 탭에서 <b>나 찾기</b>를 하면 기록이 쌓여요.</p></div>`;
  const s=mergeStats(D.map(d=>d.s)),nq=D.reduce((t,d)=>t+d.q,0);
  const season=`<div class="card"><h2>시즌 누적</h2><div class="kpi"><div><b>${km(s.distM)}</b><span>총 거리</span></div><div><b>${D.length}경기</b><span>${nq}쿼터 출전</span></div><div><b>${nz(s.sprints)?s.sprints+'회':'-'}</b><span>총 스프린트(전력 질주)</span></div></div></div>`;
  return cardHtml()+season+`<details class="more card"><summary>자세히 보기 (추이·최고 기록·배지·부하 관리)</summary>${trendHtml(D)}${seasonHtml(D)}${badgesHtml(D)}${loadHtml(D)}</details>`;
}

// 순위 탭
function rankHtml(){
  const a=curAna();if(!a)return `<div class="card"><h2>축구회 순위</h2><p class="hint">아직 분석된 경기가 없어요.</p></div>`;
  const R=allRows();let rows=[],title='',unit='';
  if(ST.rank==='q'){rows=R.filter(r=>r.a.id===a.id).map(r=>({pid:r.pid,v:r.s.distM||0}));title=`${dLabel(a.date)} ${a.q}쿼터 뛴 거리`}
  else if(ST.rank==='d'){const m={};R.filter(r=>r.a.date===a.date).forEach(r=>{m[r.pid]=(m[r.pid]||0)+(r.s.distM||0)});rows=Object.entries(m).map(([pid,v])=>({pid,v}));title=`${dLabel(a.date)} 하루 뛴 거리`}
  else{const m={};R.forEach(r=>{m[r.pid]=Math.max(m[r.pid]||0,r.s.vmaxKmh||0)});rows=Object.entries(m).map(([pid,v])=>({pid,v})).filter(r=>r.v>0);title='최고 속도 (전체 기간) · 참고 값';unit='km/h'}
  rows.sort((x,y)=>y.v-x.v);
  const fmt=v=>unit?v.toFixed(1)+' '+unit:km(v);
  return `<div class="card"><h2>축구회 순위</h2><div class="seg">${[['q','이 쿼터 거리'],['d','그날 거리'],['v','최고 속도']].map(([k,l])=>`<button data-rank="${k}" class="${ST.rank===k?'on':''}">${l}</button>`).join('')}</div>
  <p class="hint" style="margin:0 0 .4rem">${esc(title)} · 날짜와 쿼터는 경기 탭에서 고른 것 기준</p>
  <table><tr><th>순위</th><th>이름</th><th>${unit?'최고 속도':'거리'}</th></tr>${rows.map((r,i)=>`<tr class="${r.pid===ST.me.pid?'me':''}"><td>${i+1}</td><td style="text-align:left">${esc(nameOf(r.pid))}</td><td>${fmt(r.v)}</td></tr>`).join('')||'<tr><td colspan="3" class="hint">아직 이름이 맞춰진 선수가 없어요.</td></tr>'}</table>
  <p class="hint">나 찾기를 한 사람과 운영진이 이름을 맞춘 사람만 나와요.</p></div>
  <div class="card"><h2>나와 회원 평균 비교</h2>${cmpHtml(ST.rank==='q'?scopeRows('q',a.id):scopeRows('d',a.date),ST.me.pid,pitchOf(a),ST.rank==='q'?`${dLabel(a.date)} ${a.q}쿼터`:`${dLabel(a.date)} 하루`)||'<p class="hint">이 경기에서 내 기록이 없거나 비교할 회원이 없어요.</p>'}</div>`;
}

// 관리 탭: 촬영 폰 상태, 원격 조종, 영상 링크, 이름 고치기, 장면 표시, 연결 QR
function camHtml(){
  const c=ST.cam;if(!c)return `<p class="hint">촬영 폰 상태가 아직 없어요. 촬영 앱을 아래 QR로 연결해 주세요.</p>`;

  return `<p><span class="pill ${c.rec?'on':'off'}">${c.rec?'● 녹화 중':'정지'}</span> ${c.rec&&c.sinceMs?hm(c.sinceMs)+'부터':''} <span class="hint">${age==null?'':stale?`⚠ ${Math.round(age/60)}분째 소식 없음`:`${age}초 전 소식`}</span></p>
  <div class="kpi"><div><b>${c.seg??'-'}</b><span>1분 파일 번호</span></div><div><b class="${c.battery!=null&&c.battery<=20?'bad':''}">${c.battery??'-'}%</b><span>배터리</span></div><div><b class="${c.tempC!=null&&c.tempC>=42?'bad':''}">${c.tempC!=null?Math.round(c.tempC)+'°':'-'}</b><span>온도</span></div>

}

  <div class="card"><h2>선수 이름 고치기 · ${a.q}쿼터</h2><p class="hint" style="margin:0 0 .4rem">경기 탭에서 고른 쿼터예요. 추적 번호마다 선수를 지정하면 회원의 나 찾기보다 먼저 적용돼요.</p>
    <ul class="list">${(a.tracks||[]).map(t=>{const o=ownerOf(a,t.tid),s=a.stats&&a.stats[t.tid];return `<li><span style="flex:0 0 5.5rem">${t.team?t.team+'팀 ':''}#${esc(t.tid)}<br><small class="hint">${s?km(s.distM):''}${t.by?' · '+({board:'작전판',claim:'본인',admin:'운영진'}[t.by]||t.by):(!t.pid&&o?' · 본인':'')}</small></span><select data-pid="${esc(t.tid)}"><option value="">(모름)</option>${(ST.P.names||[]).map(n=>`<option value="${esc(n.id)}" ${n.id===o?'selected':''}>${esc(n.name)}</option>`).join('')}</select></li>`}).join('')}</ul>
    <button class="pri" data-act="savePid" style="width:100%;margin-top:.4rem">이름 저장</button></div>`:''}
  <div class="card"><h2>촬영 폰 연결</h2><p class="hint" style="margin:0">촬영 앱에서 <b>서버 연결 → QR 읽기</b>로 아래를 찍어 주세요.</p><div class="qr" id="camQr"></div><p class="hint" style="text-align:center;word-break:break-all">코드: <b>${esc(code)}</b></p></div>
  <div class="card"><h2>운영진</h2>${ST.user?`<p>${esc(ST.user.email)} ${ST.admin?'<span class="pill on">운영진</span>':'<span class="pill off">목록에 없음</span>'}</p>`:'<p class="hint">이 휴대폰은 기존 연결 링크로 관리 권한이 있어요.</p>'}

// ---------- 동작 ----------
async function bind(){
  const n=ST.confirm,F=ST.F,ref=F.doc(ST.db,'pub',ST.conf.code,'bind',n.id);
  try{
    const s=await F.getDoc(ref);
    if(s.exists()&&s.data().dev!==DEV){ST.confirm=null;ST.me=null;say(`${n.name} 님은 이미 다른 휴대폰에 등록돼 있어요. 휴대폰을 바꿨다면 운영자에게 등록 해제를 부탁해 주세요.`,'bad');return}
    if(!s.exists())await F.setDoc(ref,{dev:DEV,name:n.name,ts:Date.now()});
    ST.me={pid:n.id,name:n.name};saveMe(ST.me);ST.confirm=null;say(`${n.name} 님으로 등록했어요.`,'ok');
  }catch(e){ST.confirm=null;ST.me=null;say('등록하지 못했어요. 인터넷 연결을 확인해 주세요.','bad')}
}
async function camCmd(op){
  const F=ST.F;try{await F.setDoc(F.doc(ST.db,'pub',ST.conf.code,'cam','cmd'),{op,q:null,ts:Date.now()});say(op==='start'?'녹화 시작을 보냈어요.':'녹화 정지를 보냈어요.','ok')}catch(e){say('보내지 못했어요.','bad')}
}
async function addMark(){
  const t=($('markTxt')||{}).value||'';const F=ST.F,a=curAna(),now=Date.now();
  // 지금 진행 중인 쿼터: 오늘 분석 문서 중 시작 시각이 지난 마지막 것(없으면 비움)
  const live=sortedAna().filter(x=>x.startMs&&x.startMs<=now&&(!x.endMs||x.endMs>=now-5*6e4)).pop();
  try{await F.setDoc(F.doc(ST.db,'pub',ST.conf.code,'cam','marks'),{list:F.arrayUnion({ts:now,q:live?live.q:null,text:t.trim()||'장면',by:ST.user?ST.user.email:DEV})},{merge:true});say(`${hm(now)} 장면을 표시했어요.`,'ok')}catch(e){say('표시하지 못했어요.','bad')}
}
async function saveYt(){
  const F=ST.F;let n=0;
  for(const el of document.querySelectorAll('[data-yt]')){const a=ST.ana.find(x=>x.id===el.dataset.yt);const v=el.value.trim();if(!a||v===((a.video&&a.video.yt)||''))continue;
    if(v&&!ytId(v)){say(`${a.q}쿼터 링크가 유튜브 주소가 아니에요.`,'bad');return}
    try{await F.updateDoc(F.doc(ST.db,'pub',ST.conf.code,'ana',a.id),{'video.yt':v||null,updatedMs:Date.now()});n++}catch(e){say('저장하지 못했어요.','bad');return}}
  say(n?`영상 링크 ${n}개를 저장했어요.`:'바뀐 링크가 없어요.','ok');
}
async function savePid(){
  const a=curAna();if(!a)return;const F=ST.F,ref=F.doc(ST.db,'pub',ST.conf.code,'ana',a.id);
  try{
    // 저장 직전 최신 문서를 다시 읽어 tracks 만 고친다(분석기가 그사이 바꾼 값을 덮지 않게)
    const s=await F.getDoc(ref);if(!s.exists())return;const tr=(s.data().tracks||[]).map(t=>Object.assign({},t));let n=0;
    document.querySelectorAll('[data-pid]').forEach(el=>{const t=tr.find(x=>String(x.tid)===el.dataset.pid);if(!t)return;const v=el.value||null,cur=ownerOf(a,t.tid);
      if(v===cur)return;t.pid=v;t.by=v?'admin':null;n++});
    if(!n){say('바뀐 이름이 없어요.','ok');return}
    await F.updateDoc(ref,{tracks:tr,updatedMs:Date.now()});say(`이름 ${n}개를 고쳤어요.`,'ok');
  }catch(e){say('저장하지 못했어요.','bad')}
}
async function login(){
  const A=ST.A;if(!A){say('로그인을 준비하는 중이에요. 잠시 뒤 다시 눌러 주세요.','bad');return}
  try{
    // 촬영 앱 안 웹 화면: 앱이 폰의 구글 계정으로 받은 토큰을 넘겨준다
    if(window.MatchCam&&MatchCam.googleIdToken){const tk=MatchCam.googleIdToken();if(tk){await A.signInWithCredential(ST.auth,A.GoogleAuthProvider.credential(tk));return}}
    const p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    try{await A.signInWithPopup(ST.auth,p)}catch(e){if(e&&/popup-blocked|operation-not-supported/.test(e.code||''))await A.signInWithRedirect(ST.auth,p);else throw e}
  }catch(e){if(!/popup-closed|cancelled/.test((e&&e.code)||''))say('로그인하지 못했어요. '+((e&&e.code)||''),'bad')}
}
async function checkAdmin(){
  ST.admin=false;if(!ST.user||!ST.user.email)return render();
  try{const s=await ST.F.getDoc(ST.F.doc(ST.db,'admins',ST.user.email.toLowerCase()));ST.admin=s.exists()}catch(e){ST.admin=false}
  render();
}

document.addEventListener('click',e=>{
  const t=e.target;
  const tb=t.closest('[data-tab]');if(tb){ST.tab=tb.dataset.tab;ST.msg='';render();window.scrollTo(0,0);return}
  const p=t.closest('[data-pick]');if(p){const n=(ST.P.names||[]).find(x=>x.id===p.dataset.pick);if(n){ST.confirm=n;ST.msg='';render()}return}
  const sl=t.closest('[data-sel]');if(sl){ST.sel=sl.dataset.sel;ST.msg='';render();return}
  const cd=t.closest('[data-cand]');if(cd){const a=curAna();if(a){ST.pick[a.id]=cd.dataset.cand;ST.msg='';render()}return}
  const fm=t.closest('[data-fteam]');if(fm){const a=curAna();if(a){ST.fteam[a.id]=fm.dataset.fteam||null;ST.more[a.id]=false;render()}return}
  const ax=t.closest('[data-ax]');if(ax){ST.cardOpen=ST.cardOpen===ax.dataset.ax?null:ax.dataset.ax;render();return}
  const gvb=t.closest('[data-gview]');if(gvb){ST.gview=gvb.dataset.gview;render();return}
  const rk=t.closest('[data-rank]');if(rk){ST.rank=rk.dataset.rank;render();return}
  const cm=t.closest('[data-cmd]');if(cm){camCmd(cm.dataset.cmd);return}
  const ac=t.closest('[data-act]');if(!ac)return;e.preventDefault();
  const k=ac.dataset.act;
  if(k==='yes')bind();else if(k==='no'){ST.confirm=null;render()}
  else if(['refind','sugYes','sugNo','mineYes','pickNo','more'].includes(k)){const a=curAna();if(!a)return;
    if(k==='refind'){ST.reFind[a.id]=true;ST.sugNo[a.id]=true;render()}else if(k==='sugNo'){ST.sugNo[a.id]=true;render()}else if(k==='pickNo'){ST.pick[a.id]=null;render()}
    else if(k==='more'){ST.more[a.id]=true;render()}else saveMine(a,ac.dataset.t)}
  else if(k==='login')login();else if(k==='logout'){ST.A&&ST.A.signOut(ST.auth)}
  else if(k==='oldAdmin'){try{sessionStorage.setItem('bz-admin','1')}catch(err){}location.href='index.html'}
  else if(k==='mark')addMark();else if(k==='saveYt')saveYt();else if(k==='savePid')savePid();
});
document.addEventListener('change',e=>{const md=e.target.closest('[data-mday]');if(md){ST.mday=md.value;render();return}const d=e.target.closest('[data-date]');if(d){const L=sortedAna().filter(x=>x.date===d.value);if(L.length)ST.sel=L[0].id;render()}});

// ---------- 불러오기 ----------
async function loadClaims(id){
  // 옛 방식 claim/{tid} 와 새 방식 mine/{pid}(같은 날 바꿀 수 있음)를 함께 읽는다
  try{const F=ST.F,base=['pub',ST.conf.code,'ana',id];const [qc,qm]=await Promise.all([F.getDocs(F.collection(ST.db,...base,'claim')),F.getDocs(F.collection(ST.db,...base,'mine')).catch(()=>null)]);
    const m={};qc.forEach(d=>m[d.id]=d.data());ST.claims[id]=m;const mm={};if(qm)qm.forEach(d=>mm[d.id]=d.data());ST.mine[id]=mm;render()}catch(e){}
}
async function start(){
  ST.conf=readConf();ST.me=loadMe();
  ST.linkAdmin=!!load('jogi-sync');   // 기존 연결 링크(축구회 코드)로 연결된 운영진 휴대폰
  render();if(!ST.conf)return initAuth(null);
  try{
    const A=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`);
    const F=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`);
    const app=A.getApps().find(a=>a.name==='bz-m')||A.initializeApp(ST.conf.cfg,'bz-m');
    ST.F=F;ST.db=F.getFirestore(app);const code=ST.conf.code;
    initAuth(app);
    F.onSnapshot(F.doc(ST.db,'pub',code),s=>{ST.P=s.exists()?s.data():null;if(!ST.P)ST.err='회원 화면이 아직 준비되지 않았어요. 운영자에게 알려 주세요.';render()},()=>{ST.err='연결하지 못했어요. 인터넷 연결을 확인해 주세요.';render()});
    if(ST.me&&!ST.test){F.getDoc(F.doc(ST.db,'pub',code,'bind',ST.me.pid)).then(s=>{if(!s.exists()||s.data().dev!==DEV){const nm=ST.me.name;ST.me=null;saveMe(null);say(`${nm} 님 등록이 해제됐어요. 이름을 다시 골라 주세요.`,'bad')}}).catch(()=>{})}
    // 분석 문서: 최근 것부터 60개(첫 장면 사진이 들어 있어 많이 받지 않는다)
    F.onSnapshot(F.query(F.collection(ST.db,'pub',code,'ana'),F.orderBy('startMs','desc'),F.limit(60)),qs=>{
      const old=new Set(ST.ana.map(a=>a.id));ST.ana=qs.docs.map(d=>Object.assign({id:d.id},d.data()));
      ST.ana.forEach(a=>{if(!old.has(a.id)||!ST.claims[a.id])loadClaims(a.id)});render()},()=>{});
    F.onSnapshot(F.doc(ST.db,'pub',code,'cam','state'),s=>{ST.cam=s.exists()?s.data():null;if(ST.tab==='admin')render()},()=>{});
    F.onSnapshot(F.doc(ST.db,'pub',code,'cam','marks'),s=>{ST.marks=(s.exists()&&s.data().list)||[];if(ST.tab==='admin')render()},()=>{});
    setInterval(()=>{if(ST.tab==='admin')render()},30000);
  }catch(e){ST.err='연결하지 못했어요. 인터넷 연결을 확인해 주세요.';render()}
}
async function initAuth(app){
  try{
    const A=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`);
    if(!app){const AP=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`);app=AP.getApps().find(a=>a.name==='bz-m')||AP.initializeApp(DEF_CFG,'bz-m');
      if(!ST.F){ST.F=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`);ST.db=ST.F.getFirestore(app)}}
    ST.A=A;ST.auth=A.getAuth(app);
    A.getRedirectResult(ST.auth).catch(()=>{});
    A.onAuthStateChanged(ST.auth,u=>{ST.user=u;checkAdmin()});
  }catch(e){}
}
start();
</script>
