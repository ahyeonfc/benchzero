<!DOCTYPE html>
<html lang="ko">

<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f7f5,#0e1512);--card:light-dark(#fff,#16211c);--ink:light-dark(#11231a,#e8f1ec);--mute:light-dark(#5b6b62,#9db0a5);--line:light-dark(#dde6e0,#2a3a32);--deep:#0f3d2a;--go:#16a34a;--warn:#c2410c;--bad:#b91c1c;--pitch:light-dark(#2f7d4a,#1d5232)}
*{box-sizing:border-box}
html{font-size:clamp(15px,calc(100vw/26),19px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
header{background:var(--deep);color:#fff;padding:calc(.8rem + env(safe-area-inset-top)) 1rem .6rem;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.15rem;display:flex;align-items:center;gap:.5rem}
header h1 small{font-size:.8rem;font-weight:500;opacity:.85;margin-left:auto}
.tabs{display:flex;gap:.3rem;margin-top:.5rem;overflow-x:auto}
.tabs button{background:transparent;color:#fff;border:1px solid #ffffff44;min-height:2.3rem;padding:0 .8rem;border-radius:2rem;font-size:.9rem;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--deep)}
main{padding:1rem 1rem calc(2rem + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem;margin-bottom:1rem}
h2{font-size:1.05rem;margin:0 0 .6rem}h3{font-size:.95rem;margin:.8rem 0 .4rem}
button{font:inherit;cursor:pointer;border-radius:.75rem;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:2.8rem;padding:0 1rem;font-weight:700;touch-action:manipulation}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;width:100%;min-height:2.8rem;border-radius:.75rem;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 .8rem}
textarea{padding:.5rem .8rem}
.pri{background:var(--go);border-color:var(--go);color:#fff}
.bad{color:var(--bad)}.ok{color:var(--go)}.warn{color:var(--warn)}
.hint{color:var(--mute);font-size:.85rem;margin:.3rem 0 0}
.row{display:flex;gap:.5rem;align-items:center}.row>*{flex:1}
.names{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem;margin-top:.6rem}

.vid{position:relative;aspect-ratio:16/9;border-radius:.75rem;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ready{padding:1.2rem;text-align:center;color:var(--mute);background:var(--bg);border-radius:.75rem}
.frame{position:relative;border-radius:.75rem;overflow:hidden;background:#000;touch-action:manipulation}
.frame img{display:block;width:100%}
.frame .bx{position:absolute;border:2px solid #fff9;border-radius:3px;background:transparent;min-height:0;padding:0}

.frame .bx span{position:absolute;left:0;bottom:100%;font-size:.65rem;background:#000a;color:#fff;padding:0 .2rem;white-space:nowrap;border-radius:2px}
.bar{display:flex;height:1.2rem;border-radius:.4rem;overflow:hidden;background:var(--bg)}
.bar i{display:block;font-style:normal}
.leg{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.78rem;color:var(--mute);margin-top:.3rem}.leg i{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;margin-right:.25rem;vertical-align:-1px}
canvas{display:block;width:100%;border-radius:.6rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:.4rem .3rem;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;font-size:.8rem;white-space:nowrap}
tr.me td{font-weight:800;background:light-dark(#eaf7ee,#1a2d22)}
.up{color:var(--go)}.dn{color:var(--bad)}
.pill{display:inline-block;padding:.1rem .55rem;border-radius:1rem;font-size:.8rem;font-weight:700;background:var(--bg)}
.pill.on{background:var(--go);color:#fff}.pill.off{background:light-dark(#e5e7eb,#2a3a32);color:var(--mute)}
.msg{font-weight:700;min-height:1.2rem;margin:.3rem 0}
.ld{text-align:center;color:var(--mute);padding:2rem 0}
.qr{width:12rem;margin:.5rem auto;background:#fff;padding:.4rem;border-radius:.5rem}
.list{margin:0;padding:0;list-style:none}.list li{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.9rem;display:flex;gap:.5rem;align-items:center}
.list li select{width:auto;flex:1;min-height:2.3rem}
.bar.sb{height:1.6rem}.bar.sb i{color:#fff;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.ovr{flex:0 0 4.6rem;height:4.6rem;border-radius:1rem;background:var(--deep);color:#fff;display:grid;place-items:center;align-content:center}.ovr b{font-size:2rem;line-height:1}.ovr span{font-size:.75rem;opacity:.85}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}.badges div{background:var(--bg);border-radius:.75rem;padding:.5rem .6rem;display:flex;flex-direction:column}.badges .bi{font-size:1.4rem;line-height:1.2}.badges b{font-size:.9rem}.badges small{color:var(--mute);font-size:.78rem}
.trend{margin:.3rem 0 .6rem}.trend p{margin:0;font-size:.9rem}
.gauge{position:relative;height:.8rem;border-radius:.4rem;overflow:hidden;margin:.4rem 0 .2rem}.gauge i{position:absolute;top:0;bottom:0}.gauge b{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px}
.gl{position:relative;height:1.1rem;font-size:.72rem;color:var(--mute);margin:0 .6rem}.gl span{position:absolute;transform:translateX(-50%);white-space:nowrap}
em.ref{font-style:normal;font-size:.68rem;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:.3rem;padding:0 .2rem;margin-left:.15rem;vertical-align:1px}
.ovr.dim{opacity:.45}.few{background:light-dark(#fff7ed,#2a1e12);color:var(--warn);border-radius:.6rem;padding:.4rem .6rem;font-size:.85rem;font-weight:700;margin:.6rem 0 0}
.fcard{--c1:#f4c7a1;--c2:#c47a3f;--c3:#7a4a24;--fg:#2b1606;position:relative;width:15.5rem;margin:.2rem auto .4rem;padding:1.1rem 1.1rem 1.6rem;color:var(--fg);background:linear-gradient(160deg,var(--c1),var(--c2) 48%,var(--c3));clip-path:polygon(0 5%,12% 0,88% 0,100% 5%,100% 88%,50% 100%,0 88%);box-shadow:inset 0 0 0 3px #ffffff55;text-align:center}
.fcard.silver{--c1:#f8fafc;--c2:#b8c2cc;--c3:#6b7785;--fg:#1f2933}.fcard.gold{--c1:#fbefb0;--c2:#d9b23a;--c3:#8a6400;--fg:#2e2100}.fcard.dim .fc-ovr{opacity:.4}
.fc-top{position:absolute;left:1.1rem;top:1.3rem;display:flex;flex-direction:column;align-items:center;line-height:1}.fc-ovr{font-size:2.6rem;font-weight:900}.fc-pos{font-size:.95rem;font-weight:800;margin-top:.2rem}.fc-tier{font-size:.7rem;font-weight:800;margin-top:.35rem;border:1.5px solid currentColor;border-radius:.3rem;padding:.05rem .3rem}
.fc-av{width:6.2rem;height:6.2rem;margin:.6rem auto .3rem;border-radius:50%;background:#ffffff59;border:2px solid #ffffff99;display:grid;place-items:center;font-size:1.7rem;font-weight:900}
.fc-name{font-size:1.35rem;font-weight:900;padding-bottom:.35rem;border-bottom:1.5px solid currentColor;margin:0 .6rem .5rem}
.fc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem .2rem;margin:0 .2rem}.fc-stats div{display:flex;align-items:baseline;justify-content:center;gap:.25rem}.fc-stats b{font-size:1.3rem;font-weight:900}.fc-stats span{font-size:.78rem;font-weight:800;white-space:nowrap}.fc-stats sup{font-size:.55rem;opacity:.75;margin-left:.1rem}
.fc-foot{font-size:.75rem;font-weight:700;margin-top:.5rem;opacity:.8}
.axh summary{cursor:pointer;color:var(--mute);font-size:.85rem}
.seg{display:flex;gap:.3rem;margin-bottom:.6rem}.seg button{flex:1;min-height:2.3rem;font-size:.85rem;padding:0 .3rem}.seg button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
</style>

<body>
<header><h1><span id="title">벤치제로</span><small id="who"></small></h1><div class="tabs" id="tabs"></div></header>
<main><div id="app"><p class="ld">불러오는 중…</p></div></main>
<script src="qrcode.js"></script>
<script type="module">
// 벤치제로 회원 화면: 쿼터 영상, 나 찾기, 내 경기 분석, 선수 카드, 순위, 지난 경기 비교, 부하 관리
// 관리 메뉴: 구글 로그인한 운영진 또는 기존 연결 링크로 연결된 휴대폰에만 보인다
const FBV='13.4.0';
const DEF_CFG={"apiKey":"AIzaSyDvJZfjmVWOMXzNAgYciQC80qDx8n3iP6E","authDomain":"benchzero-50f14.firebaseapp.com","projectId":"benchzero-50f14","storageBucket":"benchzero-50f14.firebasestorage.app","messagingSenderId":"279178405228","appId":"1:279178405228:web:11cefb680a5a1c85837f49"};
const TEST_PREFIX='matchcamtest';   // 시험용 코드는 이 휴대폰에 저장하지 않는다(실제 출석 등록을 건드리지 않게)
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hm=t=>{const d=new Date(t);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const store=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const DEV=(()=>{try{let d=localStorage.getItem('bz-dev');if(!d){d='m'+Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>b.toString(36)).join('').slice(0,14);localStorage.setItem('bz-dev',d)}return d}catch(e){return 'm'+Math.random().toString(36).slice(2)}})();
const DN=['일','월','화','수','목','금','토'];
const dLabel=ds=>{const d=new Date(ds+'T00:00');return `${d.getMonth()+1}/${d.getDate()}(${DN[d.getDay()]})`};
const km=m=>m==null?'-':(m>=1000?(m/1000).toFixed(2)+'km':Math.round(m)+'m');
const pct=v=>v==null?'-':Math.round(v>1?v:v*100)+'%';

// 상태
const ST={conf:null,test:false,me:null,P:null,F:null,db:null,auth:null,A:null,user:null,admin:false,linkAdmin:false,
  ana:[],claims:{},sel:null,tab:'game',rank:'q',cam:null,marks:[],msg:'',mcls:'',q:'',confirm:null,claimArm:null,err:''};

// 축구회 코드 읽기: 출석(checkin.html)과 같은 저장 키(bz-ci, bz-me)를 쓴다
function readConf(){
  const h=location.hash;let code=null,cfg=DEF_CFG;
  const s=h.match(/^#((?:ci-)?[a-z0-9-]{16,})$/i);if(s)code=s[1];
  const m=h.match(/#c=([^&]+)/);
  if(m){try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));if(o.cfg&&o.code){code=o.code;cfg=o.cfg}}catch(e){}}
  if(code){
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    if(code.startsWith(TEST_PREFIX)){ST.test=true;try{sessionStorage.setItem('bz-mtest',code)}catch(e){}return{cfg,code}}
    const o={cfg,code};store('bz-ci',o);const old=load('bz-ci-code');if(old&&old!==code)store('bz-me',null);store('bz-ci-code',code);return o;
  }
  try{const t=sessionStorage.getItem('bz-mtest');if(t){ST.test=true;return{cfg:DEF_CFG,code:t}}}catch(e){}
  const c=load('bz-ci');if(c&&c.code)return c;
  // 운영진 휴대폰: 관리 화면에 저장된 회원 체크인 코드를 쓴다
  const S=load('jogi-rotation-v2');if(S&&S.ci&&S.ci.code)return{cfg:DEF_CFG,code:S.ci.code};
  return null;
}
function loadMe(){if(ST.test){try{return JSON.parse(sessionStorage.getItem('bz-mtest-me')||'null')}catch(e){return null}}return load('bz-me')}
function saveMe(v){if(ST.test){try{v?sessionStorage.setItem('bz-mtest-me',JSON.stringify(v)):sessionStorage.removeItem('bz-mtest-me')}catch(e){}return}store('bz-me',v)}

function say(t,c){ST.msg=t||'';ST.mcls=c||'';render()}
const nameOf=pid=>{const n=(ST.P&&ST.P.names||[]).find(x=>x.id===pid);return n?n.name:(pid||'')};

// 분석 문서 도우미
const docId=a=>a.id;
const sortedAna=()=>ST.ana.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.q||0)-(b.q||0));
const dates=()=>[...new Set(sortedAna().map(a=>a.date))].reverse();
function ownerOf(a,tid){const t=(a.tracks||[]).find(x=>String(x.tid)===String(tid));if(t&&t.pid)return t.pid;const c=ST.claims[a.id]&&ST.claims[a.id][tid];return c?c.pid:null}
function tidsOf(a,pid){return (a.tracks||[]).map(t=>String(t.tid)).filter(tid=>ownerOf(a,tid)===pid)}
// ---------- 분석 계산 ----------
const nz=v=>v!=null&&typeof v==='number'&&!isNaN(v);
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
function sumObj(L,k){const o={};let any=false;L.forEach(s=>{const v=s[k];if(!v)return;any=true;for(const z in v)o[z]=(o[z]||0)+(v[z]||0)});return any?o:null}
function wObj(L,k){const LL=L.filter(s=>s[k]);if(!LL.length)return null;const o={};let W=0;LL.forEach(s=>{const w=s.mins||1;W+=w;for(const z in s[k])o[z]=(o[z]||0)+(s[k][z]||0)*w});for(const z in o)o[z]/=W;return o}
function wAvg(L,k){const LL=L.filter(s=>nz(s[k]));if(!LL.length)return null;let W=0,t=0;LL.forEach(s=>{const w=s.mins||1;W+=w;t+=s[k]*w});return t/W}
// 분석기가 안 준 값 중 계산할 수 있는 것만 채운다
// 카메라 방식은 순간 오차로 최고 속도가 튈 수 있어 34km/h 를 넘는 값은 오류로 보고 버린다
const VMAX_OK=34,okV=v=>nz(v)&&v>0&&v<=VMAX_OK;
function fillStat(s){s=Object.assign({},s);if(!okV(s.vmaxKmh))s.vmaxKmh=null;if(!nz(s.workRate)&&s.mins)s.workRate=s.distM/s.mins;if(!nz(s.avgKmh)&&s.mins)s.avgKmh=s.distM/s.mins*0.06;return s}
// 여러 기록(같은 쿼터의 여러 추적 번호, 또는 하루의 여러 쿼터)을 하나로 합친다
function mergeStats(L){
  L=L.filter(Boolean);if(!L.length)return null;
  if(L.length===1){const s=fillStat(L[0]);s._segs=s.speedSeries?[s.speedSeries.length]:[];s._d5=s.dist5&&s.dist5.length?[s.dist5]:[];s._d5m=s._d5.length?[s.mins]:[];return s}
  const r={},has=k=>L.some(s=>nz(s[k]));
  ['mins','distM','sprints','hsrM','sprintM','accels','decels'].forEach(k=>{if(has(k))r[k]=L.reduce((t,s)=>t+(s[k]||0),0)});
  const z=sumObj(L,'zones');if(z)r.zones=z;const zs=sumObj(L,'zoneSec');if(zs)r.zoneSec=zs;
  {const v=L.map(s=>s.vmaxKmh).filter(okV);r.vmaxKmh=v.length?Math.max(...v):null}
  ['coverPct','devM','nearMate','ownHalf'].forEach(k=>{const v=wAvg(L,k);if(v!=null)r[k]=v});
  ['thirds','lanes','dirs','v2'].forEach(k=>{const v=wObj(L,k);if(v)r[k]=v});
  if(has('hiRatio')){const d=L.reduce((t,s)=>t+(s.distM||0),0);r.hiRatio=d?L.reduce((t,s)=>t+(s.hiRatio||0)*(s.distM||0),0)/d:0}
  const ss=L.filter(s=>s.speedSeries&&s.speedSeries.length);r.speedSeries=ss.length?[].concat(...ss.map(s=>s.speedSeries)):null;r._segs=ss.map(s=>s.speedSeries.length);
  r._d5=L.filter(s=>s.dist5&&s.dist5.length).map(s=>s.dist5);r._d5m=L.filter(s=>s.dist5&&s.dist5.length).map(s=>s.mins);
  r.sprintPaths=[].concat(...L.map(s=>s.sprintPaths||[]));
  const hs=L.filter(s=>s.heat&&s.heat.length===96);if(hs.length){const h=new Array(96).fill(0);hs.forEach(s=>s.heat.forEach((v,i)=>h[i]+=v*(s.mins||1)));const mx=Math.max(...h,1e-9);r.heat=h.map(v=>v/mx)}
  const b=L.reduce((p,s)=>(s.mins||0)>(p.mins||0)?s:p,L[0]);r.avg=b.avg;r.board=b.board;
  return fillStat(r);
}
function statOf(a,pid){return mergeStats(tidsOf(a,pid).map(t=>a.stats&&a.stats[t]))}
// 사람별 기록 모음: 전체 분석 문서에서 pid 로 묶는다
function allRows(){const out=[];sortedAna().forEach(a=>{const seen=new Set();(a.tracks||[]).forEach(t=>{const pid=ownerOf(a,t.tid);if(!pid||seen.has(pid))return;seen.add(pid);const s=statOf(a,pid);if(s)out.push({a,pid,s})})});return out}

// ---------- 화면 ----------
function tabsHtml(){
  const T=[['game','경기'],['mine','내 기록'],['rank','순위']];if(ST.admin||ST.linkAdmin)T.push(['admin','관리']);
  return T.map(([k,l])=>`<button data-tab="${k}" class="${ST.tab===k?'on':''}">${l}</button>`).join('');
}
function render(){
  const app=$('app');
  if(ST.P&&ST.P.title)$('title').textContent=ST.P.title+(ST.test?' (시험)':'');
  $('who').textContent=ST.me?ST.me.name+' 님':'';
  if(!ST.conf){
    $('tabs').innerHTML='';
    app.innerHTML=`<div class="card"><h2>링크가 필요해요</h2><p>운영자가 보낸 <b>회원 링크</b>나 운동장의 <b>QR코드</b>로 들어와 주세요. 출석 링크로 한 번 들어왔던 휴대폰이면 자동으로 연결돼요.</p></div>${adminEntryHtml()}`;
    return;
  }
  if(!ST.P){$('tabs').innerHTML='';app.innerHTML='<p class="ld">'+(ST.err?esc(ST.err):'불러오는 중…')+'</p>'+(ST.err?adminEntryHtml():'');return}
  const m=`<p class="msg ${ST.mcls}">${esc(ST.msg)}</p>`;
  if(!ST.me||ST.confirm){$('tabs').innerHTML='';app.innerHTML=pickHtml(m)+adminEntryHtml();bindPick();return}
  $('tabs').innerHTML=tabsHtml();
  if(ST.tab==='admin'&&!(ST.admin||ST.linkAdmin))ST.tab='game';
  app.innerHTML=m+(ST.tab==='game'?gameHtml():ST.tab==='mine'?mineHtml():ST.tab==='rank'?rankHtml():adminHtml())+(ST.tab!=='admin'?adminEntryHtml():'');
  afterRender();
}
function adminEntryHtml(){
  if(ST.user)return `<p class="hint" style="text-align:center">${esc(ST.user.email)} 로그인됨${ST.admin?' · 운영진':' · 운영진 목록에 없어요'} · <a href="#" data-act="logout">로그아웃</a></p>`;
  return `<p class="hint" style="text-align:center"><a href="#" data-act="login">운영진 구글 로그인</a>${ST.linkAdmin?' · <a href="#" data-act="oldAdmin">관리 화면</a>':''}</p>`;

  D.forEach((d,i)=>{if(n<=8||i%Math.ceil(n/8)===0||i===n-1)g+=`<text x="${X(i)}" y="${H-3}" font-size="8.5" text-anchor="${n>1&&i===0?'start':n>1&&i===n-1?'end':'middle'}" fill="var(--mute)">${+d.date.slice(5,7)}/${+d.date.slice(8)}</text>`});
  return `<div class="trend"><p><b>${label}</b> <span class="hint">최근 ${nz(last)?fmt(last):'-'}${unit}</span>${isPB?' <span class="pill on">개인 최고 갱신</span>':''}</p><svg viewBox="0 0 ${W} ${H}" style="width:100%">${g}</svg></div>`;
}
function trendHtml(D){
  if(D.length<2)return `<div class="card"><h2>시즌 추이</h2><p class="hint">두 경기 이상 기록이 쌓이면 추이를 보여 드려요.</p></div>`;
  return `<div class="card"><h2>시즌 추이</h2>${trendSvg(D,s=>s.distM,v=>(v/1000).toFixed(1),'뛴 거리','km')}${trendSvg(D,s=>s.vmaxKmh,v=>v.toFixed(1),'최고 속도'+REF,'km/h')}${trendSvg(D,s=>s.sprints,v=>Math.round(v),'스프린트','회')}${trendSvg(D,s=>s.workRate,v=>Math.round(v),'분당 거리','m')}<p class="hint">노란 점이 개인 최고 기록(PB)이에요.</p></div>`;
}
function pastHtml(D){
  const last=D.slice(-6).reverse(),arrow=(v,p)=>!nz(v)||!nz(p)?'':v>p*1.03?' <span class="up">▲</span>':v<p*0.97?' <span class="dn">▼</span>':'';
  return `<div class="card"><h2>지난 경기 비교</h2><table><tr><th>날짜</th><th>Q</th><th>거리</th><th>분당</th><th>최고km/h</th><th>스프린트</th></tr>${last.map((d,i)=>{const p=last[i+1],s=d.s,ps=p&&p.s;
    return `<tr><td>${dLabel(d.date)}</td><td>${d.q}</td><td>${km(s.distM)}</td><td>${nz(s.workRate)?Math.round(s.workRate):'-'}${arrow(s.workRate,ps&&ps.workRate)}</td><td>${nz(s.vmaxKmh)?s.vmaxKmh.toFixed(1):'-'}${arrow(s.vmaxKmh,ps&&ps.vmaxKmh)}</td><td>${nz(s.sprints)?s.sprints:'-'}${arrow(ps&&s.sprints/s.mins,ps&&ps.sprints/ps.mins)}</td></tr>`}).join('')}</table><p class="hint">▲▼는 바로 앞 경기와 비교예요. 쿼터 수가 달라서 분당 거리와 분당 스프린트로 비교해요.</p></div>`;
}
function loadHtml(D){
  // 최근 1주(급성) ÷ 최근 4주 주평균(만성). 1.3을 넘으면 주의, 1.5를 넘으면 부상 위험이 커진다
  const now=Date.now(),wk=[0,0,0,0],hs=[0,0,0,0];
  D.forEach(d=>{const i=Math.floor((now-Date.parse(d.date+'T12:00'))/(7*864e5));if(i>=0&&i<4){wk[i]+=d.s.distM||0;hs[i]+=d.s.hsrM||0}});
  const chronic=(wk[0]+wk[1]+wk[2]+wk[3])/4,ratio=chronic?wk[0]/chronic:null,mx=Math.max(...wk,1),hasH=hs.some(x=>x>0);
  let msg='최근 4주 기록이 쌓이면 부하를 알려 드려요.',cls='';
  if(nz(ratio)&&wk.filter(x=>x>0).length>=2){
    if(ratio>1.5){msg=`최근 1주 부하가 4주 평균의 ${ratio.toFixed(2)}배로 급격히 늘었어요. 부상 위험이 커요. 다음 경기는 출전 시간을 줄이세요.`;cls='bad'}
    else if(ratio>1.3){msg=`최근 1주 부하가 4주 평균의 ${ratio.toFixed(2)}배예요. 갑자기 늘면 다치기 쉬워요. 조금 줄여 보세요.`;cls='warn'}
    else if(ratio<0.8){msg=`최근 1주는 평소보다 적게 뛰었어요(4주 평균의 ${ratio.toFixed(2)}배). 다시 늘릴 때는 천천히 늘려요.`;cls='warn'}
    else{msg=`적정해요. 최근 1주 부하는 4주 평균의 ${ratio.toFixed(2)}배예요.`;cls='ok'}}
  const L=['최근 1주','1주 전','2주 전','3주 전'],gx=nz(ratio)?Math.min(100,ratio/2*100):null;
  return `<div class="card"><h2>부하 관리</h2>
    ${nz(gx)?`<div class="gauge"><i style="left:0;width:40%;background:#94a3b8"></i><i style="left:40%;width:25%;background:#16a34a"></i><i style="left:65%;width:10%;background:#f59e0b"></i><i style="left:75%;width:25%;background:#dc2626"></i><b style="left:${gx}%"></b></div><div class="gl"><span style="left:0">0</span><span style="left:40%">0.8</span><span style="left:52%">적정</span><span style="left:65%">1.3</span><span style="left:75%">1.5</span><span style="left:100%">2+</span></div>`:''}
    <p class="msg ${cls}">${esc(msg)}</p>
    ${[3,2,1,0].map(i=>`<div class="row" style="margin:.25rem 0"><span style="flex:0 0 4.2rem;font-size:.85rem">${L[i]}</span><div class="bar" style="flex:1"><i style="width:${wk[i]/mx*100}%;background:${i===0?'var(--go)':'#94a3b8'}"></i></div><span style="flex:0 0 4.6rem;text-align:right;font-size:.8rem;line-height:1.2">${km(wk[i])}${hasH?`<br><small class="hint">고속 ${km(hs[i])}</small>`:''}</span></div>`).join('')}
    <p class="hint">최근 4주 누적 ${km(wk.reduce((s,x)=>s+x,0))} · 주평균 ${km(chronic)} · 뛴 거리 기준</p></div>`;
}
function mineHtml(){
  const D=dayStats(ST.me.pid);
  if(!D.length)return `<div class="card"><h2>${esc(ST.me.name)} 님 선수 카드</h2><p class="hint">아직 내 기록이 없어요. 경기 탭에서 <b>나 찾기</b>를 하면 기록이 쌓여요.</p></div>`;
  const d=D.find(x=>x.date===ST.mday)||D[D.length-1];
  const sel=`<select data-mday>${D.slice().reverse().map(x=>`<option value="${x.date}" ${x.date===d.date?'selected':''}>${dLabel(x.date)} · ${x.q}쿼터</option>`).join('')}</select>`;
  return cardHtml(D)+badgesHtml(D)+
    `<div class="card"><h2>경기 리포트</h2>${sel}<p class="hint" style="margin:.3rem 0 .6rem">그날 뛴 쿼터를 모두 합친 기록이에요. 쿼터별로는 경기 탭에서 볼 수 있어요.</p>${reportHtml(d.s,d.P,'d'+d.date)}${cmpHtml(scopeRows('d',d.date),ST.me.pid,d.P,'그날')}</div>`+

function rankHtml(){
  const a=curAna();if(!a)return `<div class="card"><h2>축구회 순위</h2><p class="hint">아직 분석된 경기가 없어요.</p></div>`;
  const R=allRows();let rows=[],title='',unit='';
  if(ST.rank==='q'){rows=R.filter(r=>r.a.id===a.id).map(r=>({pid:r.pid,v:r.s.distM||0}));title=`${dLabel(a.date)} ${a.q}쿼터 뛴 거리`}
  else if(ST.rank==='d'){const m={};R.filter(r=>r.a.date===a.date).forEach(r=>{m[r.pid]=(m[r.pid]||0)+(r.s.distM||0)});rows=Object.entries(m).map(([pid,v])=>({pid,v}));title=`${dLabel(a.date)} 하루 뛴 거리`}
  else{const m={};R.forEach(r=>{m[r.pid]=Math.max(m[r.pid]||0,r.s.vmaxKmh||0)});rows=Object.entries(m).map(([pid,v])=>({pid,v})).filter(r=>r.v>0);title='최고 속도 (전체 기간) · 참고 값';unit='km/h'}
  rows.sort((x,y)=>y.v-x.v);
  const fmt=v=>unit?v.toFixed(1)+' '+unit:km(v);
  return `<div class="card"><h2>축구회 순위</h2><div class="seg">${[['q','이 쿼터 거리'],['d','그날 거리'],['v','최고 속도']].map(([k,l])=>`<button data-rank="${k}" class="${ST.rank===k?'on':''}">${l}</button>`).join('')}</div>
  <p class="hint" style="margin:0 0 .4rem">${esc(title)} · 날짜와 쿼터는 경기 탭에서 고른 것 기준</p>
  <table><tr><th>순위</th><th>이름</th><th>${unit?'최고 속도':'거리'}</th></tr>${rows.map((r,i)=>`<tr class="${r.pid===ST.me.pid?'me':''}"><td>${i+1}</td><td style="text-align:left">${esc(nameOf(r.pid))}</td><td>${fmt(r.v)}</td></tr>`).join('')||'<tr><td colspan="3" class="hint">아직 이름이 맞춰진 선수가 없어요.</td></tr>'}</table>
  <p class="hint">나 찾기를 한 사람과 운영진이 이름을 맞춘 사람만 나와요.</p></div>`;
}

async function bind(){
  const n=ST.confirm,F=ST.F,ref=F.doc(ST.db,'pub',ST.conf.code,'bind',n.id);
  try{
    const s=await F.getDoc(ref);
    if(s.exists()&&s.data().dev!==DEV){ST.confirm=null;ST.me=null;say(`${n.name} 님은 이미 다른 휴대폰에 등록돼 있어요. 휴대폰을 바꿨다면 운영자에게 등록 해제를 부탁해 주세요.`,'bad');return}
    if(!s.exists())await F.setDoc(ref,{dev:DEV,name:n.name,ts:Date.now()});
    ST.me={pid:n.id,name:n.name};saveMe(ST.me);ST.confirm=null;say(`${n.name} 님으로 등록했어요.`,'ok');
  }catch(e){ST.confirm=null;ST.me=null;say('등록하지 못했어요. 인터넷 연결을 확인해 주세요.','bad')}
}
async function claim(){
  const c=ST.claimArm;if(!c)return;ST.claimArm=null;const a=ST.ana.find(x=>x.id===c.id);if(!a)return;
  if(ownerOf(a,c.tid)){say('이미 다른 사람이 고른 네모예요.','bad');return}
  if(tidsOf(a,ST.me.pid).length){say('이 쿼터에서는 이미 나를 골랐어요. 잘못 골랐으면 운영진에게 말해 주세요.','bad');return}
  try{const F=ST.F;await F.setDoc(F.doc(ST.db,'pub',ST.conf.code,'ana',a.id,'claim',String(c.tid)),{pid:ST.me.pid,ts:Date.now()});
    (ST.claims[a.id]=ST.claims[a.id]||{})[c.tid]={pid:ST.me.pid};say('나를 찾았어요! 이제 내 기록이 보여요.','ok')}
  catch(e){say('저장하지 못했어요. 다른 사람이 먼저 골랐을 수 있어요.','bad');loadClaims(a.id)}
}
async function camCmd(op){
  const F=ST.F;try{await F.setDoc(F.doc(ST.db,'pub',ST.conf.code,'cam','cmd'),{op,q:null,ts:Date.now()});say(op==='start'?'녹화 시작을 보냈어요.':'녹화 정지를 보냈어요.','ok')}catch(e){say('보내지 못했어요.','bad')}
}
async function addMark(){
  const t=($('markTxt')||{}).value||'';const F=ST.F,a=curAna(),now=Date.now();
  // 지금 진행 중인 쿼터: 오늘 분석 문서 중 시작 시각이 지난 마지막 것(없으면 비움)
  const live=sortedAna().filter(x=>x.startMs&&x.startMs<=now&&(!x.endMs||x.endMs>=now-5*6e4)).pop();
  try{await F.setDoc(F.doc(ST.db,'pub',ST.conf.code,'cam','marks'),{list:F.arrayUnion({ts:now,q:live?live.q:null,text:t.trim()||'장면',by:ST.user?ST.user.email:DEV})},{merge:true});say(`${hm(now)} 장면을 표시했어요.`,'ok')}catch(e){say('표시하지 못했어요.','bad')}
}
async function saveYt(){
  const F=ST.F;let n=0;
  for(const el of document.querySelectorAll('[data-yt]')){const a=ST.ana.find(x=>x.id===el.dataset.yt);const v=el.value.trim();if(!a||v===((a.video&&a.video.yt)||''))continue;
    if(v&&!ytId(v)){say(`${a.q}쿼터 링크가 유튜브 주소가 아니에요.`,'bad');return}
    try{await F.updateDoc(F.doc(ST.db,'pub',ST.conf.code,'ana',a.id),{'video.yt':v||null,updatedMs:Date.now()});n++}catch(e){say('저장하지 못했어요.','bad');return}}
  say(n?`영상 링크 ${n}개를 저장했어요.`:'바뀐 링크가 없어요.','ok');
}
async function savePid(){
  const a=curAna();if(!a)return;const F=ST.F,ref=F.doc(ST.db,'pub',ST.conf.code,'ana',a.id);
  try{
    // 저장 직전 최신 문서를 다시 읽어 tracks 만 고친다(분석기가 그사이 바꾼 값을 덮지 않게)
    const s=await F.getDoc(ref);if(!s.exists())return;const tr=(s.data().tracks||[]).map(t=>Object.assign({},t));let n=0;
    document.querySelectorAll('[data-pid]').forEach(el=>{const t=tr.find(x=>String(x.tid)===el.dataset.pid);if(!t)return;const v=el.value||null,cur=ownerOf(a,t.tid);
      if(v===cur)return;t.pid=v;t.by=v?'admin':null;n++});
    if(!n){say('바뀐 이름이 없어요.','ok');return}
    await F.updateDoc(ref,{tracks:tr,updatedMs:Date.now()});say(`이름 ${n}개를 고쳤어요.`,'ok');
  }catch(e){say('저장하지 못했어요.','bad')}
}
async function login(){
  const A=ST.A;if(!A){say('로그인을 준비하는 중이에요. 잠시 뒤 다시 눌러 주세요.','bad');return}
  try{
    // 촬영 앱 안 웹 화면: 앱이 폰의 구글 계정으로 받은 토큰을 넘겨준다
    if(window.MatchCam&&MatchCam.googleIdToken){const tk=MatchCam.googleIdToken();if(tk){await A.signInWithCredential(ST.auth,A.GoogleAuthProvider.credential(tk));return}}
    const p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    try{await A.signInWithPopup(ST.auth,p)}catch(e){if(e&&/popup-blocked|operation-not-supported/.test(e.code||''))await A.signInWithRedirect(ST.auth,p);else throw e}
  }catch(e){if(!/popup-closed|cancelled/.test((e&&e.code)||''))say('로그인하지 못했어요. '+((e&&e.code)||''),'bad')}
}
async function checkAdmin(){
  ST.admin=false;if(!ST.user||!ST.user.email)return render();
  try{const s=await ST.F.getDoc(ST.F.doc(ST.db,'admins',ST.user.email.toLowerCase()));ST.admin=s.exists()}catch(e){ST.admin=false}
  render();
}

document.addEventListener('click',e=>{
  const t=e.target;
  const tb=t.closest('[data-tab]');if(tb){ST.tab=tb.dataset.tab;ST.msg='';render();window.scrollTo(0,0);return}
  const p=t.closest('[data-pick]');if(p){const n=(ST.P.names||[]).find(x=>x.id===p.dataset.pick);if(n){ST.confirm=n;ST.msg='';render()}return}
  const sl=t.closest('[data-sel]');if(sl){ST.sel=sl.dataset.sel;ST.claimArm=null;ST.msg='';render();return}
  const rk=t.closest('[data-rank]');if(rk){ST.rank=rk.dataset.rank;render();return}
  const bx=t.closest('[data-tid]');if(bx){const a=curAna();if(!a)return;const o=ownerOf(a,bx.dataset.tid);
    if(o){say(o===ST.me.pid?'이 네모가 나예요.':`${nameOf(o)} 님으로 정해진 네모예요.`,o===ST.me.pid?'ok':'');return}
    if(tidsOf(a,ST.me.pid).length){say('이 쿼터에서는 이미 나를 골랐어요.','');return}
    ST.claimArm={id:a.id,tid:bx.dataset.tid};ST.msg='';render();return}
  const cm=t.closest('[data-cmd]');if(cm){camCmd(cm.dataset.cmd);return}
  const ac=t.closest('[data-act]');if(!ac)return;e.preventDefault();
  const k=ac.dataset.act;
  if(k==='yes')bind();else if(k==='no'){ST.confirm=null;render()}
  else if(k==='claimYes')claim();else if(k==='claimNo'){ST.claimArm=null;render()}
  else if(k==='login')login();else if(k==='logout'){ST.A&&ST.A.signOut(ST.auth)}
  else if(k==='oldAdmin'){try{sessionStorage.setItem('bz-admin','1')}catch(err){}location.href='index.html'}
  else if(k==='mark')addMark();else if(k==='saveYt')saveYt();else if(k==='savePid')savePid();
});
document.addEventListener('change',e=>{const md=e.target.closest('[data-mday]');if(md){ST.mday=md.value;render();return}const d=e.target.closest('[data-date]');if(d){const L=sortedAna().filter(x=>x.date===d.value);if(L.length)ST.sel=L[0].id;ST.claimArm=null;render()}});

// ---------- 불러오기 ----------
async function loadClaims(id){
  try{const F=ST.F,qs=await F.getDocs(F.collection(ST.db,'pub',ST.conf.code,'ana',id,'claim'));const m={};qs.forEach(d=>m[d.id]=d.data());ST.claims[id]=m;render()}catch(e){}
}
async function start(){
  ST.conf=readConf();ST.me=loadMe();
  ST.linkAdmin=!!load('jogi-sync');   // 기존 연결 링크(축구회 코드)로 연결된 운영진 휴대폰
  render();if(!ST.conf)return initAuth(null);
  try{
    const A=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`);
    const F=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`);
    const app=A.getApps().find(a=>a.name==='bz-m')||A.initializeApp(ST.conf.cfg,'bz-m');
    ST.F=F;ST.db=F.getFirestore(app);const code=ST.conf.code;
    initAuth(app);
    F.onSnapshot(F.doc(ST.db,'pub',code),s=>{ST.P=s.exists()?s.data():null;if(!ST.P)ST.err='회원 화면이 아직 준비되지 않았어요. 운영자에게 알려 주세요.';render()},()=>{ST.err='연결하지 못했어요. 인터넷 연결을 확인해 주세요.';render()});
    if(ST.me&&!ST.test){F.getDoc(F.doc(ST.db,'pub',code,'bind',ST.me.pid)).then(s=>{if(!s.exists()||s.data().dev!==DEV){const nm=ST.me.name;ST.me=null;saveMe(null);say(`${nm} 님 등록이 해제됐어요. 이름을 다시 골라 주세요.`,'bad')}}).catch(()=>{})}
    // 분석 문서: 최근 것부터 60개(첫 장면 사진이 들어 있어 많이 받지 않는다)
    F.onSnapshot(F.query(F.collection(ST.db,'pub',code,'ana'),F.orderBy('startMs','desc'),F.limit(60)),qs=>{
      const old=new Set(ST.ana.map(a=>a.id));ST.ana=qs.docs.map(d=>Object.assign({id:d.id},d.data()));
      ST.ana.forEach(a=>{if(!old.has(a.id)||!ST.claims[a.id])loadClaims(a.id)});render()},()=>{});
    F.onSnapshot(F.doc(ST.db,'pub',code,'cam','state'),s=>{ST.cam=s.exists()?s.data():null;if(ST.tab==='admin')render()},()=>{});
    F.onSnapshot(F.doc(ST.db,'pub',code,'cam','marks'),s=>{ST.marks=(s.exists()&&s.data().list)||[];if(ST.tab==='admin')render()},()=>{});
    setInterval(()=>{if(ST.tab==='admin')render()},30000);
  }catch(e){ST.err='연결하지 못했어요. 인터넷 연결을 확인해 주세요.';render()}
}
async function initAuth(app){
  try{
    const A=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`);
    if(!app){const AP=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`);app=AP.getApps().find(a=>a.name==='bz-m')||AP.initializeApp(DEF_CFG,'bz-m');
      if(!ST.F){ST.F=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`);ST.db=ST.F.getFirestore(app)}}
    ST.A=A;ST.auth=A.getAuth(app);
    A.getRedirectResult(ST.auth).catch(()=>{});
    A.onAuthStateChanged(ST.auth,u=>{ST.user=u;checkAdmin()});
  }catch(e){}
}
start();
</script>
