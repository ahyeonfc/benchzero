<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d2a">
<title>벤치제로 출석</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f7f5,#0e1512);--card:light-dark(#fff,#16211c);--ink:light-dark(#11231a,#e8f1ec);--mute:light-dark(#5b6b62,#9db0a5);--line:light-dark(#dde6e0,#2a3a32);--deep:#0f3d2a;--go:#16a34a;--warn:#c2410c;--bad:#b91c1c}
*{box-sizing:border-box}
html{font-size:clamp(15px,calc(100vw/24),20px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
header{background:var(--deep);color:#fff;padding:calc(.9rem + env(safe-area-inset-top)) 1.1rem .9rem}
header h1{margin:0;font-size:1.25rem}header p{margin:.1rem 0 0;font-size:.85rem;opacity:.85}
main{padding:1rem 1rem calc(2rem + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem;margin-bottom:1rem}
h2{font-size:1.05rem;margin:0 0 .6rem}
button{font:inherit;cursor:pointer;border-radius:.75rem;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:3rem;padding:0 1rem;font-weight:700;touch-action:manipulation}
input{font:inherit;width:100%;min-height:3rem;border-radius:.75rem;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 .9rem}
.big{display:grid;place-items:center;width:min(68vw,15rem);aspect-ratio:1;border-radius:50%;margin:.5rem auto 1rem;background:var(--go);color:#fff;border:0;font-size:1.6rem;box-shadow:0 .5rem 1.5rem #16a34a55}
.big small{display:block;font-size:.85rem;font-weight:500;opacity:.9}
.big:disabled{background:light-dark(#cfd8d3,#2a3a32);color:var(--mute);box-shadow:none}
.big.done{background:var(--deep)}
.msg{text-align:center;font-weight:700;min-height:1.5rem;margin:0 0 .5rem}.msg.bad{color:var(--bad)}.msg.ok{color:var(--go)}
.names{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem;margin-top:.6rem}
.names button{min-height:2.8rem;padding:0 .3rem;font-size:.95rem}
.grp{font-size:.85rem;color:var(--mute);font-weight:700;margin:.8rem 0 0}
ol{margin:0;padding:0;list-style:none}ol li{display:flex;gap:.6rem;align-items:center;padding:.45rem .1rem;border-bottom:1px solid var(--line)}
ol li b{min-width:1.8rem;height:1.8rem;border-radius:50%;display:inline-grid;place-items:center;background:var(--bg);font-size:.85rem}
ol li.me{font-weight:800}ol li.me b{background:var(--go);color:#fff}
ol li span.t{margin-left:auto;color:var(--mute);font-size:.9rem}
.hint{color:var(--mute);font-size:.85rem;margin:.4rem 0 0}
.who{text-align:center;font-size:1.15rem;font-weight:800;margin:0}
.row{display:flex;gap:.5rem}.row button{flex:1}
.pri{background:var(--go);border-color:var(--go);color:#fff}
.ld{text-align:center;color:var(--mute);padding:2rem 0}
</style>
</head>
<body>
<header><h1 id="title">벤치제로 출석</h1><p id="today"></p></header>
<main>
<div id="app"><p class="ld">불러오는 중…</p></div>
<div class="card" id="listCard" hidden>
<h2 id="listH">오늘 도착 순서</h2>
<ol id="list"></ol>
</div>
</main>
<script type="module">
const FBV='13.4.0';
const DEF_CFG={"apiKey":"AIzaSyDvJZfjmVWOMXzNAgYciQC80qDx8n3iP6E","authDomain":"benchzero-50f14.firebaseapp.com","projectId":"benchzero-50f14","storageBucket":"benchzero-50f14.firebasestorage.app","messagingSenderId":"279178405228","appId":"1:279178405228:web:11cefb680a5a1c85837f49"};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const hm=t=>{const d=new Date(t);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const DEV=(()=>{try{let d=localStorage.getItem('bz-dev');if(!d){d='m'+Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>b.toString(36)).join('').slice(0,14);localStorage.setItem('bz-dev',d)}return d}catch(e){return 'm'+Math.random().toString(36).slice(2)}})();
const ST={conf:null,me:null,P:null,list:[],F:null,db:null,busy:false,msg:'',mcls:'',q:''};
const store=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};

function readConf(){
  const s=location.hash.match(/^#(ci-[a-z0-9]+)$/);
  if(s){const o={cfg:DEF_CFG,code:s[1]};store('bz-ci',o);const old=load('bz-ci-code');if(old&&old!==o.code)store('bz-me',null);store('bz-ci-code',o.code);try{history.replaceState(null,'',location.pathname)}catch(e){}}
  const m=location.hash.match(/#c=([^&]+)/);
  if(m){try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));if(o.cfg&&o.code){store('bz-ci',o);const old=load('bz-ci-code');if(old&&old!==o.code)store('bz-me',null);store('bz-ci-code',o.code)}}catch(e){}
    try{history.replaceState(null,'',location.pathname)}catch(e){}}
  return load('bz-ci');
}
const D=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const inWin=P=>{const n=nowHM(),f=P.from||'00:00',t=P.to||'23:59';return f<=t?n>=f&&n<=t:(n>=f||n<=t)};
const agL=a=>a?(a>=70?'70대':a+'대'):'기타';

function say(t,c){ST.msg=t||'';ST.mcls=c||'';render()}
function mine(){return ST.me&&ST.list.find(x=>x.pid===ST.me.pid)}
function render(){
  const P=ST.P,app=$('app');
  $('today').textContent=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
  if(!ST.conf){app.innerHTML='<div class="card"><h2>링크가 필요해요</h2><p>운영자가 보낸 <b>출석 링크</b>나 운동장의 <b>QR코드</b>로 들어와 주세요.</p></div>';return}
  if(!P){app.innerHTML='<p class="ld">'+(ST.err?esc(ST.err):'불러오는 중…')+'</p>';return}
  if(P.title)$('title').textContent=P.title+' 출석';
  $('listCard').hidden=false;
  const m=`<p class="msg ${ST.mcls}">${esc(ST.msg)}</p>`;
  if(!ST.me){
    const q=ST.q.trim(),L=(P.names||[]).filter(n=>!q||n.name.includes(q));
    const groups={};L.forEach(n=>{const g=agL(n.age);(groups[g]=groups[g]||[]).push(n)});
    const order=['20대','30대','40대','50대','60대','70대','기타'];
    app.innerHTML=`<div class="card"><h2>처음 한 번만 내 이름을 골라 주세요</h2>
      <p class="hint" style="margin:0 0 .6rem">고른 이름은 이 휴대폰에 등록돼요. 다음부터는 버튼 하나로 출석해요.</p>${m}
      <input id="q" placeholder="이름 검색 (예: 김세)" value="${esc(ST.q)}" autocomplete="off">
      ${order.filter(g=>groups[g]).map(g=>`<p class="grp">${g}</p><div class="names">${groups[g].map(n=>`<button data-pick="${esc(n.id)}">${esc(n.name)}</button>`).join('')}</div>`).join('')||'<p class="hint">이름이 없어요. 운영자에게 명단 등록을 부탁해 주세요.</p>'}</div>`;
    const qi=$('q');qi.oninput=()=>{ST.q=qi.value;const pos=qi.selectionStart;render();const n=$('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
    return;
  }
  if(ST.confirm){
    app.innerHTML=`<div class="card"><p class="who">${esc(ST.confirm.name)} 님이 맞나요?</p><p class="hint" style="text-align:center">이 휴대폰은 ${esc(ST.confirm.name)} 님 전용이 돼요.<br>다른 사람 이름으로는 출석할 수 없어요.</p>${m}<div class="row" style="margin-top:.8rem"><button id="no">아니에요</button><button class="pri" id="yes">네, 맞아요</button></div></div>`;
    return;
  }
  const me=mine(),open=P.on!==false&&inWin(P);
  let btn;
  if(me)btn=`<button class="big done" disabled>✓ 도착<small>${hm(me.t)} · ${ST.list.indexOf(me)+1}번째</small></button>`;
  else if(P.on===false)btn=`<button class="big" disabled>출석 닫힘<small>운영자가 아직 안 열었어요</small></button>`;
  else if(!open)btn=`<button class="big" disabled>출석 시간 아님<small>${esc(P.from||'')}~${esc(P.to||'')}에 열려요</small></button>`;
  else btn=`<button class="big" id="go" ${ST.busy?'disabled':''}>${ST.busy?'확인 중…':'도착했어요'}<small>${P.loc?'운동장에서 눌러 주세요':'누르면 출석돼요'}</small></button>`;
  app.innerHTML=`<div class="card"><p class="who">${esc(ST.me.name)} 님</p>${btn}${m}<p class="hint" style="text-align:center">이 휴대폰은 ${esc(ST.me.name)} 님 전용이에요. 바꾸려면 운영자에게 말해 주세요.</p></div>`;
}
function renderList(){
  const L=ST.list;$('listH').textContent=`오늘 도착 순서 · ${L.length}명`;
  $('list').innerHTML=L.length?L.map((x,i)=>`<li class="${ST.me&&x.pid===ST.me.pid?'me':''}"><b>${i+1}</b>${esc(x.name)}<span class="t">${hm(x.t)}</span></li>`).join(''):'<li style="border:0;color:var(--mute)">아직 아무도 안 왔어요. 첫 번째가 되어 보세요!</li>';
}
function locate(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej({code:9});navigator.geolocation.getCurrentPosition(p=>res(p.coords),rej,{enableHighAccuracy:true,timeout:15000,maximumAge:20000})})}

async function checkIn(){
  const P=ST.P,F=ST.F;if(ST.busy||!ST.me)return;
  if(!inWin(P)||P.on===false){render();return}
  ST.busy=true;say('');
  let dist=null,acc=null;
  try{
    if(P.loc&&P.loc.lat){
      let c;try{c=await locate()}catch(e){ST.busy=false;say(e&&e.code===1?'위치 권한을 허용해야 출석할 수 있어요. 브라우저 설정에서 위치를 허용해 주세요.':'위치를 못 찾았어요. 잠시 뒤 다시 눌러 주세요.','bad');return}
      dist=Math.round(D(P.loc,{lat:c.latitude,lng:c.longitude}));acc=Math.round(c.accuracy||0);
      const lim=(P.radius||300)+Math.min(acc,150);
      if(dist>lim){ST.busy=false;say(`운동장에서 약 ${dist>=1000?(dist/1000).toFixed(1)+'km':dist+'m'} 떨어져 있어요. 도착하면 눌러 주세요.`,'bad');return}
    }
    const id=today()+'_'+ST.me.pid,ref=F.doc(ST.db,'pub',ST.conf.code,'in',id);
    const ex=await F.getDoc(ref);
    if(!ex.exists())await F.setDoc(ref,{pid:ST.me.pid,name:ST.me.name,dev:DEV,date:today(),ts:F.serverTimestamp(),dist,acc});
    ST.busy=false;say('출석했어요. 오늘도 즐겁게 차세요! ⚽','ok');
  }catch(e){ST.busy=false;say('출석이 저장되지 않았어요. 인터넷 연결을 확인하고 다시 눌러 주세요.','bad')}
}
async function pick(id){
  const n=(ST.P.names||[]).find(x=>x.id===id);if(!n)return;ST.confirm=n;ST.me={pid:n.id,name:n.name};ST.msg='';render();
}
async function bind(){
  const n=ST.confirm,F=ST.F,ref=F.doc(ST.db,'pub',ST.conf.code,'bind',n.id);
  try{
    const s=await F.getDoc(ref);
    if(s.exists()&&s.data().dev!==DEV){ST.msg='';say(`${n.name} 님은 이미 다른 휴대폰에 등록돼 있어요. 휴대폰을 바꿨다면 운영자에게 등록 해제를 부탁해 주세요.`,'bad');return}
    if(!s.exists())await F.setDoc(ref,{dev:DEV,name:n.name,ts:Date.now()});
    ST.me={pid:n.id,name:n.name};store('bz-me',ST.me);ST.confirm=null;ST.msg='';say(`${n.name} 님으로 등록했어요.`,'ok');renderList();
  }catch(e){say('등록하지 못했어요. 인터넷 연결을 확인해 주세요.','bad')}
}
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-pick]');if(p){pick(p.dataset.pick);return}
  if(e.target.closest('#go'))checkIn();
  if(e.target.closest('#yes'))bind();
  if(e.target.closest('#no')){ST.confirm=null;ST.me=null;ST.msg='';render()}
});

async function start(){
  ST.conf=readConf();ST.me=load('bz-me');render();
  if(!ST.conf)return;
  try{
    const A=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`);
    const F=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`);
    const app=A.getApps().find(a=>a.name==='bz-ci')||A.initializeApp(ST.conf.cfg,'bz-ci');
    ST.F=F;ST.db=F.getFirestore(app);
    const code=ST.conf.code;
    F.onSnapshot(F.doc(ST.db,'pub',code),s=>{ST.P=s.exists()?s.data():null;if(!ST.P)ST.err='출석이 아직 준비되지 않았어요. 운영자에게 알려 주세요.';render()},()=>{ST.err='연결하지 못했어요. 인터넷 연결을 확인해 주세요.';render()});
    if(ST.me){F.getDoc(F.doc(ST.db,'pub',code,'bind',ST.me.pid)).then(s=>{if(!s.exists()||s.data().dev!==DEV){const nm=ST.me.name;ST.me=null;store('bz-me',null);say(`${nm} 님 등록이 해제됐어요. 이름을 다시 골라 주세요.`,'bad')}}).catch(()=>{})}
    let day=today(),unsub=null;
    const sub=()=>{if(unsub)unsub();unsub=F.onSnapshot(F.query(F.collection(ST.db,'pub',code,'in'),F.where('date','==',day)),qs=>{
      ST.list=qs.docs.map(d=>{const x=d.data();return{pid:x.pid,name:x.name,t:x.ts&&x.ts.toMillis?x.ts.toMillis():Date.now()}}).sort((a,b)=>a.t-b.t);renderList();render()})};
    sub();setInterval(()=>{if(today()!==day){day=today();sub()}if(ST.me&&!ST.confirm)render()},30000);
  }catch(e){ST.err='연결하지 못했어요. 인터넷 연결을 확인해 주세요.';render()}
}
start();
</script>
</body>
</html>
